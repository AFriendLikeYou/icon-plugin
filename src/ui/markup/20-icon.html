<div class="panel" id="panelIcon">

  <!-- Umfang: ersetzt die früheren Gruppen „Icon“ und „Library“ (§34) ------ -->
  <fig-segmented-control id="segUmfang" value="icon" class="umfang">
    <fig-segment value="icon" selected="true"><span data-t="umf.icon"></span></fig-segment>
    <fig-segment value="library"><span data-t="umf.library"></span></fig-segment>
  </fig-segmented-control>

  <div class="kopfblock" id="grpIcon">
    <div class="auswahlzeile">
      <fig-tooltip data-t-text="auswahl.tip" delay="600">
        <fig-button variant="input" id="auswahl">
          <fig-truncate class="hinweis" id="auswahlText"></fig-truncate>
          <span class="fueller"></span>
          <span class="chip grau" id="klasseChip"></span>
          <span class="chip" id="auswahlStatus"></span>
        </fig-button>
      </fig-tooltip>
      <div class="klassenzeile" id="klassenzeile" hidden>
        <span class="ctlLabel" data-t="klasse.label"></span>
        <fig-dropdown id="klasseSel">
          <option value="Square">Square</option>
          <option value="Circular">Circular</option>
          <option value="Wide">Wide</option>
          <option value="Tall">Tall</option>
        </fig-dropdown>
        <span class="chip geraten" id="klasseGeraten" hidden></span>
      </div>
    </div>
    <div class="reihe">
      <fig-button id="btnDiff" variant="secondary" disabled data-t="btn.vorschau"></fig-button>
      <fig-button id="btnRun" disabled data-t="btn.bauen"></fig-button>
    </div>
  </div>

  <div class="kopfblock" id="grpLibrary" hidden>
    <div class="libsumme" id="libSumme"></div>
    <div class="reihe">
      <fig-button id="btnAudit" variant="secondary" data-t="btn.audit"></fig-button>
      <fig-button id="btnAlle" data-t="btn.alle"></fig-button>
    </div>
  </div>

  <div class="optzeile">
    <fig-tooltip data-t-text="tip.snap" delay="400">
      <fig-switch id="chkSnap"><span data-t="chk.snap"></span></fig-switch>
    </fig-tooltip>
    <fig-tooltip data-t-text="tip.stroke" delay="400">
      <fig-switch id="chkStroke"><span data-t="chk.stroke"></span></fig-switch>
    </fig-tooltip>
  </div>

  <div class="kopfblock leerzustand" id="leerzustand" hidden>
    <p class="fhilfe" id="leerKarte" hidden data-t="leer.karte"></p>
    <p class="fhilfe" id="leerHinweis" data-t="leer.kurz"></p>
    <fig-button id="btnBeispiel" variant="secondary" data-t="btn.beispiel"></fig-button>
  </div>

  <div class="fazitzeile">
    <div class="fazit" id="fazit"></div>
    <fig-tooltip data-t-text="tip.undo" delay="400">
      <fig-button id="btnUndo" variant="secondary" hidden></fig-button>
    </fig-tooltip>
  </div>

  <div class="fortschritt" id="fortschritt">
    <fig-spinner aria-label="…"></fig-spinner>
    <div class="balkenrahmen"><div class="balken" id="balken"></div></div>
    <div class="zahl" id="zahl"></div>
    <div class="zahl rest" id="restzeit"></div>
    <fig-button id="btnAbbrechen" variant="ghost" data-t="btn.abbrechen" style="flex:none"></fig-button>
  </div>

  <!-- Vorschau (§33): eine Werkzeugzeile, die Bühne, darunter das Urteil ---- -->
  <div id="diff">
    <div class="vwerkzeug">
      <span class="vtitel" id="vTitel"></span>
      <fig-segmented-control id="segModus" value="neben" aria-label="Vergleich">
        <fig-segment value="neben" selected="true" data-t-title="tip.neben"><span data-t="modus.neben"></span></fig-segment>
        <fig-segment value="wischen" data-t-title="tip.wischen"><span data-t="modus.wischen"></span></fig-segment>
        <fig-segment value="ueberlagern" data-t-title="tip.ueberlagern"><span data-t="modus.ueberlagern"></span></fig-segment>
      </fig-segmented-control>
      <fig-tooltip data-t-text="tip.darstellung" delay="500">
        <fig-segmented-control id="segDarstellung" value="pixel">
          <fig-segment value="pixel" selected="true"><span data-t="dar.pixel"></span></fig-segment>
          <fig-segment value="vektor"><span data-t="dar.vektor"></span></fig-segment>
        </fig-segmented-control>
      </fig-tooltip>
      <span class="vfueller"></span>
      <fig-button id="zoomMinus" variant="ghost" class="iknopf" data-t-title="zoom.kleiner">−</fig-button>
      <fig-button id="zoomPlus" variant="ghost" class="iknopf" data-t-title="zoom.groesser">+</fig-button>
      <fig-button id="zoomFit" variant="ghost" class="iknopf" data-t-title="zoom.fitTitel" data-t="zoom.fitKurz"></fig-button>
      <fig-button id="btnGrund" variant="ghost" class="iknopf" data-t-title="v.grund">◐</fig-button>
      <fig-button id="btnMehr" variant="ghost" class="iknopf" data-t-title="v.mehr">⋯</fig-button>
      <dialog is="fig-popup" id="mehrMenu" anchor="#btnMehr" position="bottom-end" class="mehrmenu">
        <fig-tooltip data-t-text="tip.markieren" delay="400">
          <fig-switch id="chkMarkieren" checked><span data-t="v.markieren"></span></fig-switch>
        </fig-tooltip>
        <fig-tooltip data-t-text="tip.verbesserung" delay="400">
          <fig-switch id="chkVerbesserung"><span data-t="v.verbesserung"></span></fig-switch>
        </fig-tooltip>
      </dialog>
    </div>

    <div class="buehne" id="buehne">
      <canvas id="vpCanvas"></canvas>
      <div class="vptip" id="vpTip" hidden></div>
      <div class="zoompille" id="zoomPille">
        <fig-button id="zoomWertAnzeige" variant="ghost">100 %</fig-button>
        <div class="zoommenu" id="zoomMenu" hidden>
          <fig-button variant="ghost" data-zoom="fit" data-t="zoom.fit"></fig-button>
          <fig-button variant="ghost" data-zoom="1">100 %</fig-button>
          <fig-button variant="ghost" data-zoom="2">200 %</fig-button>
          <fig-button variant="ghost" data-zoom="4">400 %</fig-button>
          <fig-button variant="ghost" data-zoom="8">800 %</fig-button>
        </div>
      </div>
      <div class="bhgriff" id="bhGriff" data-t-title="v.hoehe"></div>
    </div>

    <div class="scrubberzeile" id="scrubberZeile" hidden>
      <span class="slabel" data-t="v.scrubber"></span>
      <fig-slider id="blendRegler" min="0" max="100" step="1" value="100" text="false"></fig-slider>
    </div>

    <div class="urteilzeile" id="urteil">
      <span class="upunkt"></span>
      <span class="utext" id="urteilText"></span>
      <span class="upills" id="urteilPills"></span>
    </div>

    <div class="kennzahlen" id="kennzahlen"></div>
    <div class="vlegende" id="vLegende" data-t="v.legende"></div>

    <fig-group collapsible open="false" id="grpDetails" class="diffgruppe">
      <fig-header><h3 data-t="det.titel"></h3></fig-header>

      <div class="sektion">
        <span class="ctlLabel" data-t="det.vektor"></span>
        <span class="klein" data-t="det.vektorHinweis"></span>
      </div>
      <div class="detailband"><div class="zeile" id="zellen"></div></div>

      <div class="sektion">
        <span class="ctlLabel" data-t="det.pixel"></span>
        <fig-segmented-control id="segRaster" value="1">
          <fig-segment value="1" selected="true">1×</fig-segment>
          <fig-segment value="2">2×</fig-segment>
        </fig-segmented-control>
        <span class="klein" data-t="diff.schaerfe"></span>
      </div>
      <div class="detailband"><div class="zeile" id="pxzellen"></div></div>

      <div class="sektion">
        <span class="ctlLabel" data-t="det.differenz"></span>
        <span class="ctlLabel"><span class="dot weg"></span><span data-t="diff.weg"></span></span>
        <span class="ctlLabel"><span class="dot dazu"></span><span data-t="diff.dazu"></span></span>
      </div>
      <div class="detailband"><div class="zeile" id="dfzellen"></div></div>
    </fig-group>
  </div>

  <fig-group collapsible open="false" id="grpLog" class="logblock">
    <fig-header>
      <h3 class="logtitel" data-t="log.titel"></h3>
      <span class="logaktionen" id="logAktionen">
        <fig-tooltip data-t-text="tip.undo" delay="400">
          <fig-button id="btnUndoLog" variant="ghost" hidden>↶</fig-button>
        </fig-tooltip>
        <fig-button id="btnKopieren" variant="ghost" data-t="btn.kopieren"></fig-button>
        <fig-button id="btnLeeren" variant="ghost" data-t="btn.leeren"></fig-button>
      </span>
    </fig-header>
    <div class="logfilter">
      <fig-segmented-control id="segLog" value="alle">
        <fig-segment value="alle" selected="true"><span data-t="log.filterAlle"></span></fig-segment>
        <fig-segment value="err"><span data-t="log.filterFehler"></span></fig-segment>
        <fig-segment value="warn"><span data-t="log.filterWarn"></span></fig-segment>
        <fig-segment value="info"><span data-t="log.filterInfo"></span></fig-segment>
        <fig-segment value="ok"><span data-t="log.filterOk"></span></fig-segment>
      </fig-segmented-control>
      <fig-input-text id="logSuche" type="search" data-t-ph="log.suche"></fig-input-text>
    </div>
    <div class="log" id="log"></div>
  </fig-group>
</div>
