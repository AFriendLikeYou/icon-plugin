<div class="panel" id="panelIcon">

  <!-- (a) Umfang: ersetzt die früheren Gruppen „Icon“ und „Library“ (§34) --- -->
  <fig-segmented-control id="segUmfang" value="icon" class="umfang">
    <fig-segment value="icon" selected="true"><span data-t="umf.icon"></span></fig-segment>
    <fig-segment value="library"><span data-t="umf.library"></span></fig-segment>
  </fig-segmented-control>

  <!-- (b) Titelzeile + (c) Aktionsreihe — flach, ein 1-px-Trenner (§39.7) --- -->
  <div class="abschnitt kopfabschnitt">
    <div class="titelzeile" id="titelzeile">
      <span class="tname" id="auswahlText"></span>
      <span class="chip grau klassechip" id="klasseChip"></span>
      <dialog is="fig-popup" id="klasseMenu" anchor="#klasseChip" position="bottom left" class="klassemenu">
        <div class="kmkopf" data-t="klasse.erkl"></div>
        <fig-button variant="ghost" data-klasse="Square">Square</fig-button>
        <fig-button variant="ghost" data-klasse="Circular">Circular</fig-button>
        <fig-button variant="ghost" data-klasse="Wide">Wide</fig-button>
        <fig-button variant="ghost" data-klasse="Tall">Tall</fig-button>
      </dialog>
      <span class="chip" id="auswahlStatus"></span>
      <fig-tooltip data-t-text="auswahl.tip" delay="600">
        <fig-button id="auswahl" variant="ghost" class="iknopf">◎</fig-button>
      </fig-tooltip>
    </div>
    <div class="libsumme" id="libSumme" hidden></div>

    <div class="aktionsreihe">
      <span class="agruppe" id="grpIcon">
        <fig-button id="btnRun" disabled data-t="btn.bauen"></fig-button>
        <fig-button id="btnDiff" variant="secondary" disabled data-t="btn.vorschau"></fig-button>
      </span>
      <span class="agruppe" id="grpLibrary" hidden>
        <fig-button id="btnAlle" data-t="btn.alle"></fig-button>
        <fig-button id="btnAudit" variant="secondary" data-t="btn.audit"></fig-button>
      </span>
      <fig-tooltip data-t-text="tip.undo" delay="400">
        <fig-button id="btnUndo" variant="secondary" class="iknopf" icon disabled><fig-icon name="reset"></fig-icon></fig-button>
      </fig-tooltip>
      <fig-button id="btnMehrIcon" variant="ghost" class="iknopf" icon data-t-title="v.mehr"><fig-icon name="more"></fig-icon></fig-button>
      <dialog is="fig-popup" id="mehrIconMenu" anchor="#btnMehrIcon" position="bottom right" class="mehrmenu">
        <fig-button id="btnBeispielMenu" variant="ghost" data-t="btn.beispiel"></fig-button>
        <fig-button id="btnRundgangMenu" variant="ghost" data-t="ob.rundgang"></fig-button>
      </dialog>
    </div>
  </div>

  <!-- (d) Schnellschalter ------------------------------------------------- -->
  <div class="abschnitt optzeile">
    <fig-tooltip data-t-text="tip.snap" delay="400">
      <fig-switch id="chkSnap"><label data-t="chk.snap"></label></fig-switch>
    </fig-tooltip>
    <fig-tooltip data-t-text="tip.stroke" delay="400">
      <fig-switch id="chkStroke"><label data-t="chk.stroke"></label></fig-switch>
    </fig-tooltip>
  </div>

  <div class="leerzustand" id="leerzustand" hidden>
    <p class="fhilfe" id="leerKarte" hidden data-t="leer.karte"></p>
    <p class="fhilfe" id="leerHinweis" data-t="leer.kurz"></p>
    <fig-button id="btnBeispiel" variant="secondary" data-t="btn.beispiel"></fig-button>
  </div>

  <div class="fazitzeile">
    <div class="fazit" id="fazit"></div>
  </div>

  <div class="fortschritt" id="fortschritt">
    <fig-spinner aria-label="…"></fig-spinner>
    <div class="balkenrahmen"><div class="balken" id="balken"></div></div>
    <div class="zahl" id="zahl"></div>
    <div class="zahl rest" id="restzeit"></div>
    <fig-button id="btnAbbrechen" variant="ghost" data-t="btn.abbrechen" style="flex:none"></fig-button>
  </div>

  <!-- (e) Bühne mit schwebenden Werkzeugen, (f) flache Zeilen darunter ----- -->
  <div id="diff">
    <div class="buehne" id="buehne">
      <canvas id="vpCanvas"></canvas>
      <div class="vptip" id="vpTip" hidden></div>

      <div class="ovl ovl-ol">
        <fig-segmented-control id="segModus" value="vn" aria-label="Vergleich">
          <fig-segment value="vn" selected="true" data-t-title="tip.vn"><span data-t="modus.vn"></span></fig-segment>
          <fig-segment value="ueberlagern" data-t-title="tip.ueberlagern"><span data-t="modus.ueberlagern"></span></fig-segment>
        </fig-segmented-control>
        <fig-segmented-control id="segDarstellung" value="vektor" aria-label="Darstellung" data-t-title="tip.darstellung">
          <fig-segment value="pixel"><span data-t="dar.pixel"></span></fig-segment>
          <fig-segment value="vektor" selected="true"><span data-t="dar.vektor"></span></fig-segment>
        </fig-segmented-control>
      </div>

      <div class="ovl ovl-or">
        <fig-button id="zoomFit" variant="ghost" class="iknopf" data-t-title="zoom.fitTitel" data-t="zoom.fitKurz"></fig-button>
        <fig-button id="btnGrund" variant="ghost" class="iknopf" data-t-title="v.grund">◐</fig-button>
        <fig-button id="btnRetina" variant="ghost" class="iknopf" data-t-title="tip.retina">2×</fig-button>
        <fig-button id="btnMehr" variant="ghost" class="iknopf" icon data-t-title="v.mehr"><fig-icon name="more"></fig-icon></fig-button>
        <dialog is="fig-popup" id="mehrMenu" anchor="#btnMehr" position="bottom right" class="mehrmenu">
          <fig-tooltip data-t-text="tip.punkte" delay="400">
            <fig-switch id="chkPunkte" checked><label data-t="v.punkte"></label></fig-switch>
          </fig-tooltip>
          <fig-tooltip data-t-text="tip.flaechen" delay="400">
            <fig-switch id="chkFlaechen"><label data-t="v.flaechen"></label></fig-switch>
          </fig-tooltip>
        </dialog>
      </div>

      <div class="ovl ovl-ul" id="undoPille" hidden>
        <fig-button id="btnUndoBuehne" variant="ghost"><fig-icon slot="prepend" name="reset" size="small"></fig-icon><span id="btnUndoBuehneText"></span></fig-button>
      </div>

      <div class="ovl ovl-ur zoompille" id="zoomPille">
        <fig-button id="zoomMinus" variant="ghost" icon data-t-title="zoom.kleiner"><fig-icon name="minus" size="small"></fig-icon></fig-button>
        <fig-button id="zoomWertAnzeige" variant="ghost">100 %</fig-button>
        <fig-button id="zoomPlus" variant="ghost" icon data-t-title="zoom.groesser"><fig-icon name="add" size="small"></fig-icon></fig-button>
      </div>
      <dialog is="fig-popup" id="zoomMenu" anchor="#zoomWertAnzeige" position="top right" class="zoommenu">
        <fig-button variant="ghost" data-zoom="fit" data-t="zoom.fit"></fig-button>
        <fig-button variant="ghost" data-zoom="1">100 %</fig-button>
        <fig-button variant="ghost" data-zoom="2">200 %</fig-button>
        <fig-button variant="ghost" data-zoom="4">400 %</fig-button>
        <fig-button variant="ghost" data-zoom="8">800 %</fig-button>
      </dialog>

      <div class="bhgriff" id="bhGriff" data-t-title="v.hoehe"></div>
    </div>

    <div class="vzeile" id="basisZeile" hidden>
      <span class="vlabel" data-t="v.basis"></span>
      <fig-tooltip data-t-text="tip.basis" delay="400">
        <fig-segmented-control id="segBasis" value="ohne">
          <fig-segment value="ohne" selected="true"><span data-t="v.basisOhne"></span></fig-segment>
          <fig-segment value="alt"><span data-t="v.basisAlt"></span></fig-segment>
        </fig-segmented-control>
      </fig-tooltip>
    </div>

    <div class="vzeile" id="scrubberZeile" hidden>
      <span class="vlabel" id="scrubberLabel"></span>
      <fig-slider id="blendRegler" min="0" max="100" step="1" value="50" text="false"></fig-slider>
    </div>

    <div class="vzeile urteilzeile" id="urteil">
      <span class="upunkt"></span>
      <span class="utext" id="urteilText"></span>
      <span class="upills" id="urteilPills"></span>
    </div>

    <div class="vzeile kennzahlen" id="kennzahlen"></div>
    <div class="vzeile vlegende" id="vLegende"></div>

    <fig-group collapsible open="false" id="grpHinting" class="hintgruppe">
      <fig-header><h3 data-t="hint.titel"></h3></fig-header>
      <div class="hintband" id="hintTabelle"></div>
    </fig-group>
  </div>

  <fig-group collapsible open="false" id="grpLog" class="logblock">
    <fig-header>
      <h3 class="logtitel" data-t="log.titel"></h3>
      <span class="logaktionen" id="logAktionen">
        <fig-tooltip data-t-text="tip.undo" delay="400">
          <fig-button id="btnUndoLog" variant="ghost" icon hidden><fig-icon name="reset" size="small"></fig-icon></fig-button>
        </fig-tooltip>
        <fig-button id="btnKopieren" variant="ghost" data-t="btn.kopieren"></fig-button>
        <fig-button id="btnLeeren" variant="ghost" data-t="btn.leeren"></fig-button>
      </span>
    </fig-header>
    <div class="logfilter">
      <fig-segmented-control id="segLog" value="alle">
        <fig-segment value="alle" selected="true"><span data-t="log.filterAlle"></span></fig-segment>
        <fig-segment value="err"><span data-t="log.filterFehler"></span></fig-segment>
        <fig-segment value="warn"><span data-t="log.filterWarn"></span></fig-segment>
        <fig-segment value="info"><span data-t="log.filterInfo"></span></fig-segment>
        <fig-segment value="ok"><span data-t="log.filterOk"></span></fig-segment>
      </fig-segmented-control>
      <fig-input-text id="logSuche" type="search" data-t-ph="log.suche"></fig-input-text>
    </div>
    <div class="log" id="log"></div>
  </fig-group>
</div>
