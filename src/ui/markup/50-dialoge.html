<dialog is="fig-dialog" modal class="breit" id="dlgPlan">
  <fig-header dialog-header><h3 id="planTitel"></h3></fig-header>
  <div class="dlg-text"><p id="planText"></p></div>
  <div class="plan-liste" id="planListe"></div>
  <div class="plan-summe" id="planSumme"></div>
  <div class="dlg-schalter" id="planSchalterZeile" hidden>
    <fig-switch id="chkTrockenEinzel"><span data-t="chk.trockenlaufEinzel"></span></fig-switch>
  </div>
  <div class="dlg-aktionen">
    <fig-button id="planAbbruch" variant="secondary" data-t="btn.abbrechen"></fig-button>
    <fig-button id="planOk" variant="destructive" data-t="btn.planBauen"></fig-button>
  </div>
</dialog>

<dialog is="fig-dialog" modal id="dlgReset">
  <fig-header dialog-header><h3 data-t="dlg.reset.titel"></h3></fig-header>
  <div class="dlg-text"><p data-t="dlg.reset.text"></p></div>
  <div class="profilliste" id="profilListe"></div>
  <div class="dlg-aktionen">
    <fig-button id="resetAbbruch" variant="secondary" data-t="btn.abbrechen"></fig-button>
    <fig-button id="resetOk" variant="destructive" data-t="btn.resetOk"></fig-button>
  </div>
</dialog>

<!-- Onboarding: Slideshow, Anatomie wie der Lizenz-Screen ------------------ -->
<dialog is="fig-dialog" modal class="buehne-dlg" id="dlgOnboarding">
  <div class="bh-bild" id="obBild"></div>
  <fig-button id="obSkip" variant="ghost" class="bh-x"></fig-button>
  <div class="bh-text">
    <div class="bh-zaehler" id="obZaehler"></div>
    <h2 class="bh-titel" id="obTitel"></h2>
    <p class="bh-fliess" id="obText"></p>
    <div class="bh-extra" id="obExtra"></div>
  </div>
  <div class="bh-dots" id="obDots"></div>
  <div class="bh-knoepfe zwei">
    <fig-button id="obZurueck" variant="ghost" class="bh-sekundaer"></fig-button>
    <fig-button id="obWeiter" class="bh-primaer"></fig-button>
  </div>
</dialog>

<!-- Lizenz-/Paywall-Screen: überlagert das Panel vollflächig --------------- -->
<dialog is="fig-dialog" modal class="buehne-dlg" id="dlgPaywall">
  <div class="bh-bild" id="pwBild"></div>
  <fig-button id="pwZu" variant="ghost" class="bh-x">✕</fig-button>
  <div class="bh-text">
    <h2 class="bh-titel" id="pwTitel"></h2>
    <p class="bh-fliess" id="pwText"></p>
  </div>
  <div class="bh-knoepfe">
    <fig-button id="pwKaufen" class="bh-primaer"></fig-button>
    <fig-button id="pwSpaeter" variant="secondary" class="bh-sekundaer"></fig-button>
  </div>
  <fig-card class="bh-hinweis">
    <span class="punkt"></span><span id="pwHinweisText"></span>
  </fig-card>
</dialog>

<dialog is="fig-toast" id="toast" duration="2600"><span id="toastText"></span></dialog>
