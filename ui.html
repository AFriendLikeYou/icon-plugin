  // Tastatur: nur wenn der Fokus NICHT in einem Eingabefeld steht.
  function inEingabe() {
    let el = document.activeElement;
    while (el) {
      const tag = (el.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
      if (tag.indexOf('fig-input') === 0 || tag === 'fig-dropdown') return true;
      if (el.isContentEditable) return true;
      el = el.parentElement;
    }
    return false;
  }
  document.addEventListener('keydown', e => {
    if (inEingabe() || !letzterDiff || !$('diff').classList.contains('an')) return;
    if (e.shiftKey && e.key === ')') { e.preventDefault(); zoomMitte(1, true); return; }   // Shift+0
    if (e.shiftKey && (e.key === '0' || e.code === 'Digit0')) { e.preventDefault(); zoomMitte(1, true); return; }
    if (e.shiftKey && (e.key === '!' || e.code === 'Digit1')) { e.preventDefault(); zoomFit(true); return; }
    if (e.shiftKey && (e.key === '@' || e.code === 'Digit2')) { e.preventDefault(); aufKarteZoomen(aktiveKarte, true); return; }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomMitte(stufeNehmen(1), true); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomMitte(stufeNehmen(-1), true); }
    else if (e.key === '0') { e.preventDefault(); zoomFit(true); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); karteMittig(aktiveKarte + 1, true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); karteMittig(aktiveKarte - 1, true); }
    else if (e.key === ' ' && !raumTaste) { e.preventDefault(); raumTaste = true; $('buehne').classList.add('raum'); }
  });
  document.addEventListener('keyup', e => {
    if (e.key !== ' ' || !raumTaste) return;
    raumTaste = false;
    $('buehne').classList.remove('raum');
  });

  // Viewport-Gesten: Wheel = Pan, Ctrl/Cmd+Wheel und Pinch = Zoom um den
  // Cursor (stufenlos, exponentiell), Drag/Leertaste/Mittelklick = Pan.
  (() => {
    const box = $('buehne');
    const cv = leinwand();
    const devPos = e => {
      const r = box.getBoundingClientRect();
      const p = dpr();
      return { x: (e.clientX - r.left) * p, y: (e.clientY - r.top) * p,
        cssX: e.clientX - r.left, cssY: e.clientY - r.top };
    };
    box.addEventListener('wheel', e => {
      if (!letzterDiff) return;
      e.preventDefault();
      const d = devPos(e);
      if (e.ctrlKey || e.metaKey) {
        zoomUm(d.x, d.y, ZIEL.z * Math.exp(-e.deltaY * 0.0125), false);
      } else {
        kameraSetzen(ZIEL.x + e.deltaX * dpr() / ZIEL.z, ZIEL.y + e.deltaY * dpr() / ZIEL.z, ZIEL.z, false);
      }
    }, { passive: false });

    let px = 0, py = 0, kx = 0, ky = 0, wischK = null;
    box.addEventListener('pointerdown', e => {
      if (e.target.closest('fig-button, .ovl, .bhgriff')) return;
      const d = devPos(e);
      const g = griffNah(d.x, d.y);
      if (g && !raumTaste && e.button === 0) {
        wischZieht = true; wischK = g;
        box.setPointerCapture(e.pointerId);
        return;
      }
      zieht = true;
      px = e.clientX; py = e.clientY; kx = ZIEL.x; ky = ZIEL.y;
      box.classList.add('zieht');
      box.setPointerCapture(e.pointerId);
      const tk = titelUnter(d.x, d.y);
      if (tk) { karteMittig(tk.i, true); e.preventDefault(); return; }
      const tr = kachelUnter(d.x, d.y);
      if (tr) { aktiveKarte = tr.k.i; anstossen(false); }
      e.preventDefault();
    });
    box.addEventListener('pointermove', e => {
      const d = devPos(e);
      if (wischZieht && wischK) {
        const s = wischK.N * KAM.z, x = dx(wischK.x);
        wischPos = Math.max(0, Math.min(1, (d.x - x) / Math.max(1, s)));
        anstossen(false);
        return;
      }
      if (zieht) {
        const p = dpr();
        kameraSetzen(kx - (e.clientX - px) * p / ZIEL.z, ky - (e.clientY - py) * p / ZIEL.z, ZIEL.z, false);
        return;
      }
      // Hover mit 60 ms Verzögerung
      if (hoverTimer) clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => {
        const tr = kachelUnter(d.x, d.y);
        if (!tr) { hoverSetzen(null); return; }
        const paar = paarUnter(tr);
        const text = paar ? punktText(paar) : t('px.koord', { x: tr.px, y: tr.py });
        hoverSetzen({ paar: paar, text: text, cssX: d.cssX, cssY: d.cssY });
      }, 60);
    });
    const ende = e => {
      if (zieht) { zieht = false; box.classList.remove('zieht'); }
      // Der Regler unter der Bühne zeigt dieselbe Position — einmal am Ende
      // nachziehen, nicht bei jedem Frame (sonst Attribut-Gewitter).
      if (wischZieht && vglModus !== 'ueberlagern') wert($('blendRegler'), Math.round(wischPos * 100));
      wischZieht = false; wischK = null;
      try { box.releasePointerCapture(e.pointerId); } catch (err) {}
    };
    box.addEventListener('pointerup', ende);
    box.addEventListener('pointercancel', ende);
    box.addEventListener('pointerleave', () => { hoverSetzen(null); });
    box.addEventListener('dblclick', e => {
      const d = devPos(e);
      const tr = kachelUnter(d.x, d.y);
      if (!tr) { zoomFit(true); return; }
      aufKarteZoomen(tr.k.i, true);
    });
    window.addEventListener('resize', () => {
      if (!letzterDiff) return;
      if (leinwandMessen()) { klemmen(ZIEL); anstossen(false); }
    });
    if (cv) cv.addEventListener('contextmenu', e => e.preventDefault());
  })();

  // Strukturierte Fehler aus der Validierung: [{ pfad, text }].
  // Der Pfad entspricht dem data-pfad-Attribut des zugehörigen Felds.
  function fehlerText(f) { return (f && typeof f === 'object') ? (f.text || '') : String(f == null ? '' : f); }
  function fehlerPfad(f) { return (f && typeof f === 'object') ? (f.pfad || '') : ''; }
  function korrekturenMarkieren() {
    const nach = {}, warn = {};
    (konfigFehler || []).forEach(f => {
      const p = fehlerPfad(f);
      if (!p) return;
      const ziel = (f && f.art === 'warnung') ? warn : nach;
      ziel[p] = ziel[p] ? ziel[p] + '\n' + fehlerText(f) : fehlerText(f);
    });
    document.querySelectorAll('[data-pfad]').forEach(el => {
      const p = el.getAttribute('data-pfad');
      const txt = nach[p] || warn[p];
      el.classList.toggle('ungueltig', !!nach[p]);
      el.classList.toggle('warnung', !nach[p] && !!warn[p]);
      if (txt) el.setAttribute('title', txt);
      else if (!el.hasAttribute('data-title-fest')) el.removeAttribute('title');
    });
  }
  function fehlerZeichnen() {
    const box = $('cfgFehler'), liste = $('cfgFehlerListe');
    const f = konfigFehler || [];
    liste.textContent = '';
    box.hidden = !f.length;
    f.forEach(s => {
      const li = document.createElement('li');
      li.textContent = fehlerText(s);
      if (s && s.art === 'warnung') li.className = 'warnung';
      liste.appendChild(li);
    });
    korrekturenMarkieren();
  }

  // ---- Konfig-Datei: Export / Import ---------------------------------------
  function dateiLaden(name, inhalt, typ) {
    const blob = (inhalt instanceof Blob) ? inhalt : new Blob([inhalt], { type: typ || 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  $('btnKonfigExport').addEventListener('click', () => {
    if (!cfgLokal) return;
    dateiLaden('icon-pipeline.konfig.json',
      JSON.stringify(cfgLokal, null, 2), 'application/json');
    toast(t('toast.exportiert'));
  });
  $('fileKonfig').addEventListener('change', () => {
    const el = $('fileKonfig');
    const datei = el.files && el.files[0];
    if (!datei) return;
    const leser = new FileReader();
    leser.onload = () => {
      let k = null;
      try { k = JSON.parse(String(leser.result)); } catch (err) { k = null; }
      if (!k || typeof k !== 'object' || Array.isArray(k) || !k.groessen) {
        toast(t('toast.importFehler'));
        return;
      }
      wartetAufSpeichern = true;
      send({ type: 'konfigSpeichern', konfig: k });
      toast(t('toast.importiert'));
    };
    leser.onerror = () => toast(t('toast.importFehler'));
    leser.readAsText(datei);
  });

        + gfeld(t('cfg.radiusWert'), 'tip.radiusWert', 'hilf.radiusWert',

        + '<div class="keyvizhalter">' + keylineViz(g.N, g.keylines) + '</div>'

        g.N = neuN;
        if (!g.keylinesManuell && alt > 0) keylinesSkalieren(g, neuN / alt);
        keylinesOffen[i] = true;            // zeigen, was sich geändert hat
        groessenZeichnen();

      zahlBinden('.fKontur', v => { g.kontur = v; });

        if (!e.target.checked) return;

      });
      const auf = karte.querySelector('.keyauf');
      auf.addEventListener('click', () => {
        const kb = karte.querySelector('.keyblock');
        keylinesOffen[i] = kb.hidden;
        kb.hidden = !kb.hidden;

      box.appendChild(karte);

  }

  const KEY_FARBEN = { Square: '#d3308f', Circular: '#0e8a9a', Wide: '#c98a12', Tall: '#5b5bd6' };
  // Skizze: Kasten N×N mit Pixelraster, darüber die vier Keyline-Formen.
  // Wide/Tall werden 3:2 bzw. 2:3 gezeichnet — nur die lange Seite ist die Keyline.
  function keylineSvg(N, keylines, px) {
    px = px || 132;
    const S = px / N, c = px / 2;
    const linie = (x1, y1, x2, y2, op) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#8a8a96" stroke-opacity="' + op + '" stroke-width="1"/>';
    let raster = '';
    if (N <= 64) for (let i = 1; i < N; i++) raster += linie(i * S, 0, i * S, px, 0.16) + linie(0, i * S, px, i * S, 0.16);
    else for (let i = 4; i < N; i += 4) raster += linie(i * S, 0, i * S, px, 0.16) + linie(0, i * S, px, i * S, 0.16);
    const mitte = linie(c, 0, c, px, 0.35) + linie(0, c, px, c, 0.35);
    const form = (kl, k) => {
      if (!(k > 0)) return '';
      const f = KEY_FARBEN[kl], a = 'fill="' + f + '" fill-opacity="0.08" stroke="' + f + '" stroke-width="1.25"';
      const w = k * S;
      if (kl === 'Circular') return '<circle cx="' + c + '" cy="' + c + '" r="' + (w / 2) + '" ' + a + '/>';
      if (kl === 'Square')   return '<rect x="' + (c - w / 2) + '" y="' + (c - w / 2) + '" width="' + w + '" height="' + w + '" ' + a + '/>';
      if (kl === 'Wide')     return '<rect x="' + (c - w / 2) + '" y="' + (c - w / 3) + '" width="' + w + '" height="' + (w * 2 / 3) + '" ' + a + ' stroke-dasharray="3 2"/>';
      return '<rect x="' + (c - w / 3) + '" y="' + (c - w / 2) + '" width="' + (w * 2 / 3) + '" height="' + w + '" ' + a + ' stroke-dasharray="3 2"/>';
    };
    return '<svg width="' + px + '" height="' + px + '" viewBox="0 0 ' + px + ' ' + px + '">'
      + raster + mitte + ['Wide', 'Tall', 'Square', 'Circular'].map(kl => form(kl, keylines[kl])).join('') + '</svg>';
  }
  function keylineViz(N, keylines) {
    const leg = KLASSEN.map(kl => '<span><i class="' + (kl === 'Circular' ? 'rund' : '') + '" style="background:' + KEY_FARBEN[kl] + '"></i>'
      + esc(kl) + ' ' + zahl(keylines[kl]) + '</span>').join('');
    return '<div class="keyviz">' + keylineSvg(N, keylines) + '<div class="legende">' + leg
      + '<span style="margin-top:4px">' + esc(t('cfg.keylinesLegende', { N: zahl(N) })) + '</span></div></div>';
  }
  function keylinesSkalieren(g, f) {
    KLASSEN.forEach(kl => { g.keylines[kl] = Math.round(g.keylines[kl] * f * 2) / 2; });

  function keylinesKurz(g) {

  // ---- Farbwerte von Library-Tokens nachladen ------------------------------
  // Library-Variablen kommen ohne hex. Beim Aufklappen einer Kollektion holen
  // wir die Werte in Paketen zu 40 (`farbenWerte`) und schreiben sie in die Zeilen.
  const TOKEN_HEX = {};        // key → hex | null (null = nicht auflösbar)
  const TOKEN_LAEUFT = {};     // key → true, solange eine Anfrage unterwegs ist
  function farbenWerteAnfordern(keys) {
    const offen = (keys || []).filter(k => k && !(k in TOKEN_HEX) && !TOKEN_LAEUFT[k]);
    for (let i = 0; i < offen.length; i += 40) {
      const paket = offen.slice(i, i + 40);
      paket.forEach(k => { TOKEN_LAEUFT[k] = true; });
      send({ type: 'farbenWerte', keys: paket });

  }
  function tokenSwatchSetzen(zeile, hex) {
    const alt = zeile.querySelector('fig-skeleton, fig-swatch');
    const s = document.createElement('fig-swatch');
    s.setAttribute('background', hex || '#d9d9d9');
    s.setAttribute('size', 'small');
    if (alt) zeile.replaceChild(s, alt); else zeile.insertBefore(s, zeile.firstChild);
  }
  function tokenSwatchesAktualisieren() {
    document.querySelectorAll('#varListe .varzeile[data-key]').forEach(z => {
      const k = z.getAttribute('data-key');
      if (!(k in TOKEN_HEX)) return;
      if (z.querySelector('fig-swatch')) return;
      tokenSwatchSetzen(z, TOKEN_HEX[k]);
    });
    gewaehlteVariableZeichnen(null);
  }
  bei('farbenWerteErgebnis', m => {
    const w = (m && m.werte) || {};
    Object.keys(w).forEach(k => { TOKEN_HEX[k] = w[k] || null; delete TOKEN_LAEUFT[k]; });
    tokenSwatchesAktualisieren();
  });
  function passt(name, koll) {
    if (!farbSuche) return true;
    const s = farbSuche.toLowerCase();

  function variableWaehlen(v) {

  function varZeile(v, mitSwatch, koll) {
    const gew = cfgLokal.farbe.variable
      && ((v.id && cfgLokal.farbe.variable.id === v.id) || (v.key && cfgLokal.farbe.variable.key === v.key));

  function varListeZeichnen() {
    const box = $('varListe');

    // Punkt-Navigation

  // Wechsel mit kurzer Ein-/Ausblendung (CSS, 180 ms).
  function obGehe(i) {
    if (i < 0 || i >= OB_ANZ || i === obSchritt) return;
    const dlg = $('dlgOnboarding');
    dlg.classList.add('bh-wechsel');
    setTimeout(() => {
      obSchritt = i;
      obZeichnen();
      dlg.classList.remove('bh-wechsel');

  }

  function obAuf(schritt) {
    obSchritt = schritt || 0;

    obZeichnen();
    dialogAuf('dlgOnboarding');
  }
  function obZu() {
    obOffen = false;
    dialogZu('dlgOnboarding');

    paywallStartPruefen();
  }

  $('obSkip').addEventListener('click', obZu);
  // Auf dem Welcome-Screen ist der linke Knopf „Direkt loslegen“.
  $('obZurueck').addEventListener('click', () => {
    if (obSchritt === 0) obZu(); else obGehe(obSchritt - 1);
  });
  $('obWeiter').addEventListener('click', () => {

  $('btnRundgang').addEventListener('click', () => obAuf(0));
  // Esc schließt den Dialog von selbst — das zählt als „überspringen“.
  $('dlgOnboarding').addEventListener('close', () => {

  document.addEventListener('keydown', e => {

    if (e.key === 'ArrowLeft') { e.preventDefault(); obGehe(obSchritt - 1); }
  });

  merkerLaden('onboardingGesehen');
  merkerLaden('ersteSchritte');
  merkerLaden('ersteSchritteAus');

  // ===== 86-lizenz.js =====
  // =========================================================================
  // Lizenz — Kopf-Chip, Einstellungen-Block, vollflächiger Lizenz-Screen
  // =========================================================================
  let LIZENZ = null;                 // { status, resttage, debug, modell, kostenpflichtig }
  let paywallGezeigtSitzung = false; // nur im Speicher, nicht im clientStorage
  let paywallGrund = 'TRIAL_ENDED', paywallFunktion = '', paywallLogText = '';

  function lizenzVoll() {
    const s = LIZENZ && LIZENZ.status;

  }
  function lizenzTitel() {
    if (!LIZENZ) return t('liz.unbekannt');
    if (LIZENZ.status === 'DEV') return t('liz.dev');
    if (lizenzVoll()) return t('liz.voll');
    if (LIZENZ.status === 'TRIAL') return t('liz.test', { tage: LIZENZ.resttage == null ? '?' : LIZENZ.resttage });
    return t('liz.frei');
  }
  function lizenzFunktionName(f) {
    const k = 'liz.fn.' + f;
    const txt = t(k);
    return txt === k ? f : txt;
  }
  function lizenzUmfangText() {
    const liste = ((LIZENZ && LIZENZ.kostenpflichtig) || ['alle', 'bericht', 'exportieren', 'konfigImport'])

    if ($('lizBild')) $('lizBild').innerHTML = li.svg || '';
    if ($('lizInhTitel')) $('lizInhTitel').textContent = inh(li.titel);
    if ($('lizInhText')) $('lizInhText').textContent = inh(li.text);
    if ($('lizModell')) $('lizModell').textContent = t('liz.modellEinmal');
    if ($('lizUmfang')) $('lizUmfang').textContent = lizenzUmfangText();

    const dbg = $('lizDebug');
    if (dbg) {
      dbg.hidden = !(LIZENZ && LIZENZ.debug);
      if (LIZENZ && LIZENZ.debug && LIZENZ.status !== 'DEV') wert($('segLizDebug'), LIZENZ.status);
    }
  }

  // ---- Lizenz-Screen (überlagert das Panel) -------------------------------
  function lizenzSkizze() {
    const m = (cfgLokal && cfgLokal.master)
      || { groesse: 72, keylines: { Square: 56, Circular: 60, Wide: 64, Tall: 64 } };
    return '<div class="marke-gross">' + keylineSvg(m.groesse, m.keylines, 64) + '</div>'
      + '<div class="skizze"><span class="bunt">' + esc(t('titel')) + '</span></div>';
  }
  function paywallZeichnen() {
    $('pwBild').innerHTML = lizenzSkizze();
    const trial = LIZENZ && LIZENZ.status === 'TRIAL';
    if (paywallGrund === 'PAID_FEATURE') {
      $('pwTitel').textContent = t('liz.pwTitelFn');
      // Der Hauptthread schickt den Funktionsnamen im Log-Text mit; ohne
      // eigenes Feld nehmen wir diesen Text als Erklärung.
      $('pwText').textContent = paywallFunktion

    $('pwSpaeter').textContent = trial ? t('liz.pwSpaeterTrial') : t('liz.pwSpaeterAus');
    $('pwHinweisText').textContent = t('liz.pwHinweis');
  }
  function paywallZeigen(grund, funktion, logText) {
    paywallGrund = grund || 'TRIAL_ENDED';
    paywallFunktion = funktion || '';

    paywallZeichnen();

  $('pwZu').addEventListener('click', () => dialogZu('dlgPaywall'));
  $('pwSpaeter').addEventListener('click', () => dialogZu('dlgPaywall'));
  $('pwKaufen').addEventListener('click', () => {

  });
  $('btnLizKaufen').addEventListener('click', () => send({ type: 'lizenzKaufen', grund: 'PAID_FEATURE' }));
  // Kauf auf einem anderen Gerät: Status neu vom Figma-Konto holen.
  $('btnLizStatus').addEventListener('click', () => { send({ type: 'lizenzStatus' }); toast(t('toast.lizStatus')); });
  $('segLizDebug').addEventListener('change', e => {

  // ---- Nachrichten --------------------------------------------------------
  function lizenzUebernehmen(l) {
    if (!l) return;
    LIZENZ = l;
    lizenzZeichnen();
    paywallStartPruefen();
  }
  // Einmal je Sitzung: wer nicht gekauft hat, sieht den Screen beim Start —
  // aber erst, wenn der Rundgang durch ist (sonst liegen zwei Dialoge übereinander).
  function paywallStartPruefen() {
    if (paywallGezeigtSitzung) return;
    if (obOffen || onboardingGesehen !== true) return;
    if (!LIZENZ || LIZENZ.status !== 'UNPAID') return;
    paywallGezeigtSitzung = true;
    paywallZeigen('TRIAL_ENDED', '');
  }
  bei('lizenz', m => lizenzUebernehmen(m));
  bei('konfig', m => { if (m && m.lizenz) lizenzUebernehmen(m.lizenz); });
  bei('log', m => {
    if (!m || m.code !== 'LIZENZ_NOETIG') return;
    const txt = [m.text, m.hinweis].filter(Boolean).join(' ');
    paywallZeigen('PAID_FEATURE', m.funktion ? lizenzFunktionName(m.funktion) : '', txt);
  });

  // ===== 90-bericht.js =====
  // =========================================================================
  // Bericht — Kacheln, Filter, Tabelle, Auswahl, CSV
  // Begriffe nach ARCHITEKTUR.md §27: Rasterfehler, weiche Pixel, Maß stimmt.
  // =========================================================================
  let berichtFilter = 'alle';     // alle | ohneSet | veraltet | mass | schlecht
  let berichtWahl = {};           // Icon-Name → true (Export-Auswahl)
  const BER_FILTER = [
    ['alle', 'fltAlle'], ['ohneSet', 'fltOhneSet'], ['veraltet', 'fltVeraltet'],
    ['mass', 'fltMass'], ['schlecht', 'fltSchlecht']
  ];

  $('btnBericht').addEventListener('click', () => {
    if (beschaeftigt) return;
    $('fazit').className = 'fazit';
    sperren(true);
    send({ type: 'bericht' });
  });
  // Neuer Bericht → Auswahl und Filter zurück auf Anfang.
  bei('bericht', () => {
    berichtWahl = {};
    berichtFilter = 'alle';
    berichtZeichnen();
  });

  function berichtGroessen() {
    if (!bericht) return [];
    const set = {};
    (bericht.zeilen || []).forEach(z => Object.keys(z.groessen || {}).forEach(n => { set[n] = true; }));
    return Object.keys(set).map(Number).filter(n => isFinite(n)).sort((a, b) => a - b);
  }
  // Farbskala grün (0) → rot (ab 0,15) als Zellenhintergrund.
  function treueFarbe(v) {
    if (v == null || !isFinite(v)) return 'transparent';
    const p = Math.max(0, Math.min(1, v / 0.15));
    const r = Math.round(46 + p * (194 - 46));
    const g = Math.round(167 - p * (167 - 64));
    const b = Math.round(106 - p * (106 - 42));
    return 'rgba(' + r + ',' + g + ',' + b + ',0.28)';
  }
  function zahl3(v) { return (v == null || !isFinite(v)) ? t('ber.keineDaten') : zahl(v.toFixed(3)); }

  function zeileTreue(z) {
    const werte = Object.keys(z.groessen || {})
      .map(n => z.groessen[n] && z.groessen[n].treue)
      .filter(v => v != null && isFinite(v));
    if (!werte.length) return null;
    return werte.reduce((a, b) => a + b, 0) / werte.length;
  }
  function zeileMassFehler(z) {
    return Object.keys(z.groessen || {}).some(n => z.groessen[n] && z.groessen[n].keylineOk === false);
  }
  // Schlechteste 10 % nach mittlerem Rasterfehler (mindestens eine Zeile).
  function schlechteste(zeilen) {
    const mit = zeilen.map(z => ({ z: z, v: zeileTreue(z) })).filter(x => x.v != null);
    if (!mit.length) return [];
    mit.sort((a, b) => b.v - a.v);
    return mit.slice(0, Math.max(1, Math.ceil(mit.length * 0.1))).map(x => x.z);
  }
  function berichtSichtbar() {
    const alle = (bericht && bericht.zeilen) || [];
    if (berichtFilter === 'ohneSet') return alle.filter(z => !z.hatSet);
    if (berichtFilter === 'veraltet') return alle.filter(z => !!z.veraltet);
    if (berichtFilter === 'mass') return alle.filter(zeileMassFehler);
    if (berichtFilter === 'schlecht') {
      const s = schlechteste(alle);
      return alle.filter(z => s.indexOf(z) >= 0);
    }
    return alle.slice();
  }

  function berichtSortieren(zeilen) {
    const z = zeilen.slice();
    const sp = berichtSort.spalte, ab = berichtSort.ab;
    z.sort((a, b) => {
      let x, y;
      if (sp === 'name') { x = String(a.name || '').toLowerCase(); y = String(b.name || '').toLowerCase(); }
      else {
        const ga = (a.groessen || {})[sp], gb = (b.groessen || {})[sp];
        x = ga && ga.treue != null ? ga.treue : Infinity;
        y = gb && gb.treue != null ? gb.treue : Infinity;
      }
      if (x < y) return ab ? 1 : -1;
      if (x > y) return ab ? -1 : 1;
      return 0;
    });
    return z;
  }

  function kachel(id, label, wert, trend) {
    $(id).setAttribute('label', label);
    const w = $(id + 'Wert');
    w.textContent = '';
    const s = document.createElement('span');
    s.textContent = wert;
    w.appendChild(s);
    if (trend) {
      const p = document.createElement('span');
      p.className = 'trend ' + (trend.gut ? 'gut' : 'schlecht');
      p.textContent = trend.gut ? '↓' : '↑';
      p.title = trend.titel || '';
      w.appendChild(p);
    }
  }

  // ---- Auswahl -------------------------------------------------------------
  function gewaehlteNamen() {
    return Object.keys(berichtWahl).filter(n => berichtWahl[n]);
  }
  function umfangZeichnen() {
    const n = gewaehlteNamen().length;
    const el = $('segExportNamen');
    if (el) el.textContent = t('ber.umfangNamen', { n: n });
    const seg = $('segExportUmfang').querySelector('fig-segment[value="namen"]');
    if (seg) {
      if (n) seg.removeAttribute('disabled');
      else {
        seg.setAttribute('disabled', '');
        if (String($('segExportUmfang').value || '') === 'namen') $('segExportUmfang').setAttribute('value', 'alle');
      }
    }
  }
  function kopfHakenSetzen(sichtbar) {
    const box = $('chkAlleSichtbaren');
    box.setAttribute('label', t('ber.alleSichtbaren'));
    const n = sichtbar.filter(z => berichtWahl[z.name]).length;
    anhaken(box, n > 0 && n === sichtbar.length);
    if (n > 0 && n < sichtbar.length) box.setAttribute('indeterminate', 'true');
    else box.removeAttribute('indeterminate');
  }

  function berichtZeichnen() {
    umfangZeichnen();
    const leer = $('berichtLeer'), wrap = $('berichtTabWrap'), kach = $('berichtKacheln');
    if (!bericht) {
      leer.hidden = false; wrap.hidden = true; kach.hidden = true;
      $('berichtLegende').hidden = true; $('berichtFilterZeile').hidden = true;
      $('berichtTabKopf').hidden = true;
      $('berichtZeit').textContent = ''; aus($('btnCsv'), true); return;
    }
    leer.hidden = true; wrap.hidden = false; kach.hidden = false;
    $('berichtLegende').hidden = false; $('berichtFilterZeile').hidden = false;
    $('berichtTabKopf').hidden = false;
    aus($('btnCsv'), false);
    const z = bericht.zusammenfassung || {};
    $('berichtZeit').textContent = bericht.zeit
      ? t('ber.zeit', { zeit: new Date(bericht.zeit).toLocaleString(SPR === 'de' ? 'de-DE' : 'en-US') }) : '';
    kachel('kachelIcons', t('ber.icons'), String(z.icons == null ? '–' : z.icons));
    kachel('kachelOhneSet', t('ber.ohneSet'), String(z.ohneSet == null ? '–' : z.ohneSet));
    kachel('kachelVeraltet', t('ber.veraltet'), String(z.veraltet == null ? '–' : z.veraltet));
    let trend = null;
    if (z.treueMittel != null && z.treueMittelVorher != null && isFinite(z.treueMittelVorher)) {
      const d = z.treueMittel - z.treueMittelVorher;
      if (Math.abs(d) > 0.0005) trend = { gut: d < 0, titel: zahl3(z.treueMittelVorher) };
    }
    kachel('kachelTreue', t('ber.treueMittel'), zahl3(z.treueMittel), trend);
    kachel('kachelKeyline', t('ber.keylineOk'),
      (z.keylineOk == null ? '–' : z.keylineOk) + '/' + (z.keylineGesamt == null ? '–' : z.keylineGesamt));

    BER_FILTER.forEach(f => {
      const b = $(f[1]);
      b.classList.toggle('fltaktiv', berichtFilter === f[0]);
    });

    const sichtbar = berichtSichtbar();
    $('berichtZaehler').textContent = t('ber.zaehler', {
      n: sichtbar.length, m: (bericht.zeilen || []).length });
    kopfHakenSetzen(sichtbar);

    const Ns = berichtGroessen();
    const tab = $('berichtTab');
    tab.textContent = '';
    const kopf = document.createElement('tr');
    const thWahl = document.createElement('th');
    thWahl.className = 'wspalte';
    kopf.appendChild(thWahl);
    const thName = document.createElement('th');
    const tipName = document.createElement('fig-tooltip');
    tipName.setAttribute('text', t('ber.sortieren'));
    tipName.setAttribute('delay', '500');
    const spName = document.createElement('span');
    spName.textContent = t('ber.spalteName') + (berichtSort.spalte === 'name' ? (berichtSort.ab ? ' ↓' : ' ↑') : '');
    tipName.appendChild(spName);
    thName.appendChild(tipName);
    thName.addEventListener('click', () => {
      berichtSort = { spalte: 'name', ab: berichtSort.spalte === 'name' ? !berichtSort.ab : false };
      berichtZeichnen();
    });
    kopf.appendChild(thName);
    Ns.forEach(N => {
      const th = document.createElement('th');
      th.className = 'gz';
      const tip = document.createElement('fig-tooltip');
      tip.setAttribute('text', t('ber.tipSpalte', { n: zahl(N) }) + ' — ' + t('ber.tipTreue'));
      tip.setAttribute('delay', '500');
      const sp = document.createElement('span');
      sp.textContent = zahl(N) + ' px' + (berichtSort.spalte === String(N) ? (berichtSort.ab ? ' ↓' : ' ↑') : '');
      tip.appendChild(sp);
      th.appendChild(tip);
      th.addEventListener('click', () => {
        berichtSort = { spalte: String(N), ab: berichtSort.spalte === String(N) ? !berichtSort.ab : false };
        berichtZeichnen();
      });
      kopf.appendChild(th);
    });
    tab.appendChild(kopf);

    if (!sichtbar.length) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = Ns.length + 2;
      td.className = 'berichtleer';
      td.textContent = t('ber.keineTreffer');
      tr.appendChild(td);
      tab.appendChild(tr);
      return;
    }

    berichtSortieren(sichtbar).forEach(zeile => {
      const tr = document.createElement('tr');
      const tdW = document.createElement('td');
      tdW.className = 'wspalte';
      const box = document.createElement('fig-checkbox');
      if (berichtWahl[zeile.name]) box.setAttribute('checked', '');
      box.addEventListener('change', e => {
        const an = !!(e && e.detail ? e.detail.checked : e.target.checked);
        if (an) berichtWahl[zeile.name] = true; else delete berichtWahl[zeile.name];
        umfangZeichnen();
        kopfHakenSetzen(berichtSichtbar());
      });
      tdW.appendChild(box);
      tr.appendChild(tdW);

      const td = document.createElement('td');
      const n = document.createElement('span');
      n.className = 'iname';
      n.textContent = zeile.name || '';
      n.addEventListener('click', () => { if (zeile.nodeId) send({ type: 'fokus', nodeId: zeile.nodeId }); });
      td.appendChild(n);
      if (!zeile.hatSet) {
        const c = document.createElement('span');
        c.className = 'chip rot'; c.style.marginLeft = '6px';
        c.textContent = t('ber.chipOhneSet');
        td.appendChild(c);
      } else if (zeile.veraltet) {
        const c = document.createElement('span');
        c.className = 'chip geraten'; c.style.marginLeft = '6px';
        c.textContent = t('ber.chipVeraltet');
        td.appendChild(c);
      }
      tr.appendChild(td);
      Ns.forEach(N => {
        const c = document.createElement('td');
        c.className = 'gz';
        const g = (zeile.groessen || {})[N];
        if (!g) { c.textContent = t('ber.keineDaten'); tr.appendChild(c); return; }
        const tw = document.createElement('span');
        tw.className = 'treuewert';
        tw.style.background = treueFarbe(g.treue);
        tw.textContent = zahl3(g.treue);
        c.appendChild(tw);
        const aa = document.createElement('span');
        aa.className = 'aawert';
        aa.textContent = (g.aa == null ? t('ber.keineDaten') : g.aa + ' %');
        c.appendChild(aa);
        const k = document.createElement('span');
        k.className = g.keylineOk ? 'keyja' : 'keynein';
        k.style.marginLeft = '5px';
        k.textContent = g.keylineOk ? '✓' : '✗';
        c.appendChild(k);
        const tip = [t('ber.tipTreue'), t('ber.tipAa'), t('ber.tipMass')];
        if (g.keylineIst != null || g.keylineSoll != null) {
          tip.push(t('zelle.keyline', {
            ist: g.keylineIst == null ? '?' : zahl(Number(g.keylineIst).toFixed(2)),
            soll: g.keylineSoll == null ? '?' : zahl(g.keylineSoll) }));
        }
        if (g.raster) tip.push(t('zelle.gerastet', { n: g.raster.auf + '/' + g.raster.gesamt }));
        (g.struktur || []).forEach(s => tip.push(s));
        c.title = tip.join('\n');
        tr.appendChild(c);
      });
      tab.appendChild(tr);
    });
  }

  BER_FILTER.forEach(f => {
    $(f[1]).addEventListener('click', () => {
      if (!bericht) return;
      berichtFilter = f[0];
      berichtZeichnen();

  $('chkAlleSichtbaren').addEventListener('change', e => {
    if (!bericht) return;

  // ---- CSV -----------------------------------------------------------------
  function csvFeld(v) {
    const s = String(v == null ? '' : v);
    return /[";\n]/.test(s) ? '"' + s.split('"').join('""') + '"' : s;
  }
  $('btnCsv').addEventListener('click', () => {
    if (!bericht) return;
    const kopf = ['name', 'hatSet', 'veraltet', 'N', 'rasterfehler', 'rasterfehlerVorher', 'weichePixel',
      'keylineIst', 'keylineSoll', 'massStimmt', 'rasterAuf', 'rasterGesamt'];
    const zeilen = [kopf.join(';')];
    (bericht.zeilen || []).forEach(z => {
      const Ns = Object.keys(z.groessen || {}).map(Number).sort((a, b) => a - b);
      if (!Ns.length) zeilen.push([z.name, z.hatSet ? 1 : 0, z.veraltet ? 1 : 0, '', '', '', '', '', '', '', '', ''].map(csvFeld).join(';'));
      Ns.forEach(N => {
        const g = z.groessen[N] || {};
        const r = g.raster || {};
        zeilen.push([z.name, z.hatSet ? 1 : 0, z.veraltet ? 1 : 0, N,
          g.treue == null ? '' : g.treue, g.treueVorher == null ? '' : g.treueVorher,
          g.aa == null ? '' : g.aa, g.keylineIst == null ? '' : g.keylineIst,
          g.keylineSoll == null ? '' : g.keylineSoll, g.keylineOk ? 1 : 0,
          r.auf == null ? '' : r.auf, r.gesamt == null ? '' : r.gesamt].map(csvFeld).join(';'));
      });
    });
    dateiLaden('icon-bericht.csv', '﻿' + zeilen.join('\r\n'), 'text/csv;charset=utf-8');
    toast(t('toast.csv'));
  });

  // ===== 92-export.js =====
  // =========================================================================
  // SVG-Export → ZIP (Store-Methode, CRC32, ohne Bibliothek)
  // =========================================================================
  // Umfang: Alle · Ausgewählte (Haken in der Bericht-Tabelle) · Aktuelles Icon.
  $('btnExport').addEventListener('click', () => {
    if (beschaeftigt) return;
    const wahl = String($('segExportUmfang').value || 'alle');
    const namen = gewaehlteNamen();
    if (wahl === 'namen' && !namen.length) { toast(t('ber.exportLeer')); return; }
    if (wahl === 'auswahl' && !hatAuswahl) { toast(t('ber.exportLeer')); return; }
    $('fazit').className = 'fazit';
    sperren(true);
    if (wahl === 'namen') send({ type: 'exportieren', umfang: 'namen', namen: namen });
    else send({ type: 'exportieren', umfang: wahl === 'auswahl' ? 'auswahl' : 'alle' });
  });

  let CRC_TAB = null;
  function crcTabelle() {
    if (CRC_TAB) return CRC_TAB;
    const t8 = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t8[n] = c >>> 0;
    }
    CRC_TAB = t8;
    return t8;
  }
  function crc32(bytes) {
    const tb = crcTabelle();
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = tb[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  // Minimales ZIP: lokale Dateiheader + zentrales Verzeichnis + End-Record.
  // Nur Methode 0 (Store), Namen UTF-8 (Flag Bit 11), keine Zeitstempel.
  function zipBauen(eintraege) {
    const enc = new TextEncoder();
    const teile = [], zentral = [];
    let offset = 0;
    eintraege.forEach(e => {
      const name = enc.encode(e.name);
      const daten = e.bytes;
      const crc = crc32(daten);
      const lh = new Uint8Array(30 + name.length);
      const lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034B50, true);
      lv.setUint16(4, 20, true);         // benötigte Version
      lv.setUint16(6, 0x0800, true);     // Flags: Bit 11 = UTF-8
      lv.setUint16(8, 0, true);          // Methode 0 = Store
      lv.setUint16(10, 0, true);         // Zeit
      lv.setUint16(12, 0x2821, true);    // Datum (2000-01-01)
      lv.setUint32(14, crc, true);
      lv.setUint32(18, daten.length, true);
      lv.setUint32(22, daten.length, true);
      lv.setUint16(26, name.length, true);
      lv.setUint16(28, 0, true);
      lh.set(name, 30);
      teile.push(lh, daten);

      const ch = new Uint8Array(46 + name.length);
      const cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014B50, true);
      cv.setUint16(4, 20, true);         // erstellt von
      cv.setUint16(6, 20, true);         // benötigte Version
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x2821, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, daten.length, true);
      cv.setUint32(24, daten.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint16(30, 0, true);         // extra
      cv.setUint16(32, 0, true);         // Kommentar
      cv.setUint16(34, 0, true);         // Datenträger
      cv.setUint16(36, 0, true);         // interne Attribute
      cv.setUint32(38, 0, true);         // externe Attribute
      cv.setUint32(42, offset, true);
      ch.set(name, 46);
      zentral.push(ch);
      offset += lh.length + daten.length;
    });
    let zLaenge = 0;
    zentral.forEach(c => { zLaenge += c.length; });
    const ende = new Uint8Array(22);
    const ev = new DataView(ende.buffer);
    ev.setUint32(0, 0x06054B50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, eintraege.length, true);
    ev.setUint16(10, eintraege.length, true);
    ev.setUint32(12, zLaenge, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);
    return new Blob(teile.concat(zentral, [ende]), { type: 'application/zip' });
  }

  // sprite.svg: je Icon-SVG ein <symbol id="name-N" viewBox="…">.
  function spriteBauen(dateien) {
    const teile = [];
    dateien.forEach(d => {
      const pfad = String(d.pfad || '');
      if (!/\.svg$/i.test(pfad)) return;
      const inhalt = String(d.inhalt || '');
      const auf = inhalt.match(/<svg\b[^>]*>/i);
      if (!auf) return;
      const zu = inhalt.lastIndexOf('</svg>');
      if (zu < 0) return;
      const innen = inhalt.slice(auf.index + auf[0].length, zu);
      const vb = auf[0].match(/viewBox="([^"]*)"/i);
      const basis = pfad.split('/').pop().replace(/\.svg$/i, '');
      teile.push('<symbol id="' + esc(basis) + '"'
        + (vb ? ' viewBox="' + esc(vb[1]) + '"' : '') + '>' + innen + '</symbol>');
    });
    if (!teile.length) return null;
    return '<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n'
      + teile.join('\n') + '\n</svg>\n';
  }

  function exportEmpfangen(m) {
    exportFehlend = m.fehlend || [];
    const box = $('exportFehlt'), liste = $('exportFehltListe');
    liste.textContent = '';
    box.hidden = !exportFehlend.length;
    exportFehlend.forEach(n => {
      const li = document.createElement('li');
      li.textContent = n;
      liste.appendChild(li);
    });
    const dateien = m.dateien || [];
    if (!dateien.length) { toast(t('ber.exportLeer')); return; }
    const enc = new TextEncoder();
    const eintraege = dateien.map(d => ({ name: String(d.pfad), bytes: enc.encode(String(d.inhalt == null ? '' : d.inhalt)) }));
    if ($('chkSprite').checked) {
      const sp = spriteBauen(dateien);
      if (sp) eintraege.push({ name: 'sprite.svg', bytes: enc.encode(sp) });
    }
    dateiLaden('icons.zip', zipBauen(eintraege));
    toast(t('toast.zip'));
  }


  // ===== 95-nachrichten.js =====
  // =========================================================================
  // Nachrichten vom Hauptthread
  // =========================================================================
  onmessage = e => {
    const m = e.data.pluginMessage; if (!m) return;

    if (m.type === 'auswahl') {
      const vorher = ziel ? ziel.name : null;
      ziel = m.ziel || null;
      hatAuswahl = !!ziel;
      if (!ziel || vorher !== ziel.name) chipLeeren();
      auswahlZeichnen();
      if (!beschaeftigt) { aus($('btnRun'), !hatAuswahl); aus($('btnDiff'), !hatAuswahl);
        aus($('btnVorschauMit'), !hatAuswahl || !cfgLokal); }
    }

    if (m.type === 'log') {
      logListe.push({ art: m.art || '', text: m.text || '', hinweis: m.hinweis || '', nodeId: m.nodeId || null });
      protokollZeichnen();
    }

    if (m.type === 'progress') {
      $('balken').style.width = Math.round(100 * m.i / m.n) + '%';
      $('zahl').textContent = m.i + '/' + m.n + (m.name ? ' · ' + m.name : '');
    }

    if (m.type === 'fazit') {
      if (m.beiAuswahl) {
        const c = $('auswahlStatus');
        c.className = 'chip ' + (m.gut ? 'gruen' : 'rot');
        c.textContent = m.text;
      } else {
        $('fazit').className = 'fazit ' + (m.gut ? 'gruen' : 'rot');
        $('fazit').textContent = m.text;
      }
    }

    if (m.type === 'diff') {
      letzterDiff = m;
      if (m.temporaer) tabWechseln('icon');
      renderDiff();
      const c = $('auswahlStatus');
      c.className = 'chip ' + (m.temporaer ? 'geraten' : 'blau');
      c.textContent = m.temporaer ? t('chip.ungespeichert') : t('btn.vorschau');
    }

    if (m.type === 'plan') {
      planDaten = m;
      if (m.umfang) planUmfang = m.umfang;
      planZeichnen();
      dialogAuf('dlgPlan');
    }

    if (m.type === 'bericht') {
      bericht = m;
      berichtZeichnen();
      tabWechseln('bericht');
    }

    if (m.type === 'exportDaten') {
      try { exportEmpfangen(m); } catch (err) {
        logListe.push({ art: 'err', text: String(err && err.message || err) });
        protokollZeichnen();
      }
    }

    if (m.type === 'mess') {
      (async () => {
        const werte = [];
        for (const p of m.paare) {
          try {
            const r1 = await analysiere(p.px1, false, false);
            const fehler = await treue(p.px1, p.px8);
            werte.push({ aa: r1.aa, fehler });
          } catch (err) { werte.push({ aa: 999, fehler: 999 }); }
        }
        send({ type: 'messwert', id: m.id, werte });
      })();
    }

    if (m.type === 'einstellungen') {
      anhaken($('chkSnap'), m.snap);
      anhaken($('chkStroke'), m.stroke);
      // Fehlt das Feld, bleibt es beim Standard: Trockenlauf anzeigen.
      trockenlaufEinzel = m.trockenlaufEinzel === true;
      anhaken($('chkTrockenEinzel'), trockenlaufEinzel);
    }

    if (m.type === 'konfig') konfigUebernehmen(m);

    if (m.type === 'farben') {
      farben = m;
      farbenAngefragt = false;
      varListeZeichnen();
      gewaehlteVariableZeichnen(null);
    }

    if (m.type === 'farbeGeprueft') gewaehlteVariableZeichnen(m);

    if (m.type === 'fertig') sperren(false);

    (HANDLER[m.type] || []).forEach(fn => { try { fn(m); } catch (err) { console.error('Handler', m.type, err); } });
  };


  // ===== 99-start.js =====
  // =========================================================================
  // Start
  // =========================================================================
  $('btnAbbrechen').hidden = true;
  texteSetzen();
  send({ type: 'init', sprache: SPR });

</script>
