<style>
/* 10-basis.css */
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-size: 11px; line-height: 1.5;
    color: var(--figma-color-text, #1c1c22);
    background: var(--figma-color-bg, #fff);
    margin: 0; padding: 10px 14px 14px;
    display: flex; flex-direction: column; gap: 9px; height: 100vh;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--figma-color-border, #e3e3e6); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .kopf { display: flex; align-items: center; gap: 10px; flex: none; }
  .marke { flex: none; display: flex; align-items: flex-end; gap: 2px; }
  .marke i { display: block; border-radius: 2px; background: var(--figma-color-bg-brand, #0d99ff); }
  .marke i:nth-child(1) { width: 7px;  height: 7px;  opacity: .45; }
  .marke i:nth-child(2) { width: 9px;  height: 9px;  opacity: .7; }
  .marke i:nth-child(3) { width: 12px; height: 12px; }
  .kopf h1 { font-size: 13px; font-weight: 700; margin: 0; }
  .kopf .kopfchip { margin-left: auto; }

  body > fig-tabs { flex: none; }
  .panel { display: flex; flex-direction: column; gap: 9px; flex: 1 1 auto; min-height: 0; }
  /* Icon-Tab: eine Flex-Spalte über die volle Panelhöhe. Flache Abschnitte
     mit Trennern statt Kästen (§39.7), die Vorschau nimmt den Rest. */
  #panelIcon { overflow-y: auto; padding-right: 2px; gap: 0; }
  #diff { flex: 1 1 auto; min-height: 320px; }
  .panel[hidden] { display: none; }
  #panelCfg { overflow-y: auto; padding-right: 2px; gap: 12px; }

  body > fig-tooltip { display: block; }
  .chip { flex: none; display: none; font-size: 9.5px; font-weight: 700;
    padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
  .chip.gruen { display: inline-block; background: #12a76a; color: #fff; }
  .chip.rot { display: inline-block; background: #c2402a; color: #fff; }
  .chip.blau { display: inline-block; background: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, #fff); }
  .chip.grau { display: inline-block; background: var(--figma-color-bg-secondary, #f0f0f3);
    color: var(--figma-color-text-secondary, #6e6e76); }
  .chip.geraten { display: inline-block; background: rgba(201,138,18,.16); color: #8a6208; }

  .reihe { display: flex; gap: 8px; }
  .reihe fig-button { flex: 1; }

  .gruppe {
    display: flex; flex-direction: column; gap: 8px;
    border: 1px solid var(--figma-color-border, #e3e3e6);
    border-radius: 8px; padding: 9px 12px 11px; flex: none;
  }
  .gruppenkopf { font-size: 9px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--figma-color-text-secondary, #6e6e76); }
  .optzeile { display: flex; gap: 16px; align-items: center; flex: none;
    height: 18px; overflow: hidden; }
  .optzeile fig-switch { font-size: 9.5px; white-space: nowrap; }
  .optzeile fig-tooltip { display: inline-flex; flex: none; }

  .fortschritt { display: none; gap: 9px; align-items: center; height: 16px; flex: none; }
  .fortschritt.an { display: flex; }
  .fortschritt fig-spinner { width: 14px; height: 14px; flex: none; }
  .balkenrahmen { flex: 1; height: 4px; border-radius: 2px; overflow: hidden;
    background: var(--figma-color-bg-secondary, #f0f0f3); }
  .balken { height: 100%; width: 0%; background: var(--figma-color-bg-brand, #0d99ff);
    border-radius: 2px; transition: width .18s ease; }
  .fortschritt .zahl { font-variant-numeric: tabular-nums; font-size: 10px;
    color: var(--figma-color-text-secondary, #6e6e76); white-space: nowrap; }
  .fazit { display: none; border-radius: 6px; padding: 2px 8px; font-weight: 600;
    font-size: 10.5px; line-height: 18px; flex: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fazit.gruen { display: block; background: rgba(18,167,106,.1); color: #0e8a57; }
  .fazit.rot { display: block; background: rgba(194,64,42,.1); color: #c2402a; }

  /* Die Vorschau ist kein Kasten mehr, sondern eine Folge flacher Zeilen. */
  #diff { display: none; padding: 8px 0 0; }
  #diff.an { display: flex; flex-direction: column; gap: 0; }
  .ctlLabel { font-size: 9.5px; color: var(--figma-color-text-secondary, #6e6e76); }

  /* dunkler Grund: die Bühne folgt dem Hintergrund-Umschalter */
  #diff.dunkel .buehne { background: #1e1e1e; }
  #diff.dunkel .ctlLabel { color: #b9b9c2; }

  dialog[is="fig-dialog"] { max-width: 330px; border: none; border-radius: 10px; padding: 0; }
  dialog[is="fig-dialog"] p { margin: 0; line-height: 1.55; color: var(--figma-color-text-secondary, #6e6e76); }
  .dlg-text { padding: 4px 12px 8px; }
  .dlg-aktionen { display: flex; gap: 8px; justify-content: flex-end; padding: 4px 12px 12px; }
  .dlg-wahl { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 4px; }

  fig-group.logblock { flex: none; margin: 0; border: 1px solid var(--figma-color-border, #e3e3e6);
    border-radius: 8px; background: var(--figma-color-bg, #fff); padding: 0; }
  fig-group.logblock > fig-header { padding: 2px 10px; min-height: 22px;
    display: flex; align-items: center; gap: 8px; }
  fig-group.logblock h3.logtitel { margin: 0; font-size: 9px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase;
    color: var(--figma-color-text-secondary, #6e6e76); }
  fig-group.logblock .logaktionen { margin-left: auto; }
  fig-group.logblock .log { max-height: 220px; }
  .log {
    flex: 1; overflow-y: auto; border-radius: 8px; padding: 8px 12px;
    border: 1px solid var(--figma-color-border, #d9d9de);
    background: var(--figma-color-bg, #fff);
    font: 10.5px/1.75 "SF Mono", ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .log > div + div { border-top: 1px solid color-mix(in srgb, var(--figma-color-border, #e3e3e6) 45%, transparent); }
  .log .ok > .txt::before   { content: "\2713 "; color: #12a76a; }
  .log .warn > .txt::before { content: "\25B3 "; color: #c98a12; }
  .log .err > .txt::before  { content: "\2715 "; color: #c2402a; }
  .log .hinw { color: var(--figma-color-text-tertiary, #9a9aa0); padding-left: 14px; }
  .log .zeigen { color: var(--figma-color-text-brand, #0d99ff); cursor: pointer;
    text-decoration: underline; margin-left: 6px; font-family: Inter, sans-serif; }
  .log .leermeldung { color: var(--figma-color-text-tertiary, #9a9aa0); font-style: italic;
    font-family: Inter, sans-serif; border: none; }

  /* ---- Einstellungen ---------------------------------------------------- */
  .cfgblock { display: flex; flex-direction: column; gap: 8px;
    border: 1px solid var(--figma-color-border, #e3e3e6); border-radius: 8px;
    padding: 9px 12px 12px; flex: none; }
  .feld { display: flex; align-items: center; gap: 8px; }
  .feld > .fname { flex: none; width: 108px; color: var(--figma-color-text-secondary, #6e6e76); }
  .feld > fig-dropdown, .feld > fig-input-text, .feld > fig-input-number { flex: 1; min-width: 0; }
  .vier { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 8px; }
  .vier .feld > .fname { width: 62px; }
  .groessekarte { border: 1px solid var(--figma-color-border, #e3e3e6); border-radius: 7px;
    padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 6px;
    background: var(--figma-color-bg, #fff); }
  .gkopf { display: flex; align-items: center; gap: 8px; }
  .gkopf .gtitel { font-weight: 700; font-variant-numeric: tabular-nums; }
  .gkopf .rechts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .gkopf fig-radio { font-size: 9.5px; white-space: nowrap; }
  .gzeilen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 8px; }
  .gzeilen .feld > .fname { width: 54px; }
  .keyauf { align-self: flex-start; font-size: 9.5px; }
  .keyblock[hidden] { display: none; }
  .keyblock { border-top: 1px dashed var(--figma-color-border, #e3e3e6); padding-top: 6px; }
  .keyzeile { display: flex; align-items: center; gap: 6px; }
  .keyviz { display: flex; gap: 12px; align-items: flex-start; margin: 2px 0 8px; }
  .keyviz svg { flex: none; border-radius: 4px; border: 1px solid var(--figma-color-border, #e3e3e6); background: #fff; }
  .keyviz .legende { display: flex; flex-direction: column; gap: 3px; font-size: 9.5px;
    color: var(--figma-color-text-secondary, #6e6e76); font-variant-numeric: tabular-nums; }
  .keyviz .legende span { display: flex; align-items: center; gap: 6px; }
  .keyviz .legende i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
  .keyviz .legende i.rund { border-radius: 50%; }
  .keyzeile .keykurz { font-size: 9.5px; color: var(--figma-color-text-secondary, #6e6e76); font-variant-numeric: tabular-nums; }
  .keyhinweis { font-size: 9.5px; color: var(--figma-color-text-secondary, #6e6e76); margin: 2px 0 6px; line-height: 1.4; }
  .keyprop { font-size: 9.5px; align-self: flex-start; }
  fig-input-number.unplausibel { outline: 1px solid #c98a12; border-radius: 4px; }
  .ungueltig { outline: 1px solid #c2402a; outline-offset: 1px; border-radius: 4px; }
  .warnung { outline: 1px solid #c98a12; outline-offset: 1px; border-radius: 4px; }
  li.warnung { color: #c98a12; }
  .fehlerbox { border-radius: 6px; padding: 7px 10px; font-size: 10px;
    background: rgba(201,138,18,.12); color: #8a6208; }
  .fehlerbox ul { margin: 4px 0 0; padding-left: 16px; }
  .cfgaktionen { display: flex; gap: 8px; padding-bottom: 4px; }
  .cfgaktionen fig-button { flex: 1; }
  .varsuche { margin-bottom: 4px; }
  .varliste { max-height: 190px; overflow-y: auto; border-radius: 6px;
    border: 1px solid var(--figma-color-border, #e3e3e6); padding: 4px; }
  .varzeile { display: flex; align-items: center; gap: 7px; padding: 3px 5px;
    border-radius: 4px; cursor: pointer; }
  .varzeile:hover { background: var(--figma-color-bg-secondary, #f0f0f3); }
  .varzeile.gewaehlt { background: var(--figma-color-bg-brand-tertiary, rgba(13,153,255,.14)); }
  .varzeile .vname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .varzeile .vkoll { flex: none; color: var(--figma-color-text-tertiary, #9a9aa0); font-size: 9px; }
  .varleer { padding: 6px; color: var(--figma-color-text-tertiary, #9a9aa0); font-style: italic; }
  .gewaehltzeile { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
  .platte { width: 12px; height: 12px; border-radius: 3px; flex: none;
    border: 1px solid var(--figma-color-border, #e3e3e6); }
  fig-group.kollektion { margin-bottom: 0; }

  /* ---- Trockenlauf-Dialog ------------------------------------------------ */
  dialog[is="fig-dialog"].breit { max-width: 400px; }
  .plan-liste { max-height: 232px; overflow-y: auto; display: flex; flex-direction: column;
    gap: 4px; padding: 4px 12px 2px; }
  .plan-zeile { display: flex; align-items: baseline; gap: 7px; padding: 4px 7px;
    border-radius: 5px; background: var(--figma-color-bg-secondary, #f5f5f7); }
  .plan-zeile .pname { font-weight: 600; flex: none; max-width: 45%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-zeile .pdetail { flex: 1; min-width: 0; font-size: 9.5px;
    color: var(--figma-color-text-secondary, #6e6e76); }
  .plan-zeile .pwarn { color: #8a6208; font-size: 9.5px; }
  .plan-zeile .pschloss { flex: none; }
  .plan-summe { padding: 7px 12px 0; font-size: 10px;
    color: var(--figma-color-text-secondary, #6e6e76); line-height: 1.5; }
  .dlg-schalter { padding: 8px 12px 0; }
  .dlg-schalter[hidden] { display: none; }
  .profilliste { display: flex; flex-direction: column; gap: 6px;
    max-height: 230px; overflow-y: auto; padding: 4px 12px; }
  .profilkarte { display: flex; flex-direction: column; gap: 2px; padding: 7px 9px;

  .profilkarte:hover { background: var(--figma-color-bg-secondary, #f0f0f3); }

  /* ---- Leerzustand ------------------------------------------------------- */

  /* ---- Bericht ----------------------------------------------------------- */

  .kachelzahl { font-size: 15px; font-weight: 700; padding: 3px 4px 0;

  .btabelle .keyja { color: #12a76a; } .btabelle .keynein { color: #c2402a; }
  .berichtleer { color: var(--figma-color-text-tertiary, #9a9aa0); font-style: italic; padding: 4px 2px; }
  .berichtzeit { font-size: 9.5px; color: var(--figma-color-text-tertiary, #9a9aa0); }
  .warnliste { border-radius: 6px; padding: 7px 10px; font-size: 10px;
    background: rgba(201,138,18,.12); color: #8a6208; }
  .warnliste ul { margin: 4px 0 0; padding-left: 16px; }
  .exportzeile { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dateizeile { display: flex; align-items: center; gap: 8px; }
  .dateizeile fig-input-file { flex: 1; min-width: 0; }

/* 20-einstellungen.css */
/* =========================================================================
   Runde 4 · Paket UI-1 — Kopf, Startseite, Einstellungen, Onboarding, Lizenz
   Rhythmus: Karten 12 px innen, Überschriften 11 px fett, Hilfetexte 9,5 px
   sekundär, Abstände 8 / 12 / 16 px.
   ========================================================================= */

/* ---- Kopf --------------------------------------------------------------- */
.kopf fig-tooltip { display: flex; flex: none; }
.kopf .rundgang { min-width: 22px; height: 22px; font-weight: 700; }
.kopf .lizchip { margin-left: 6px; }
.chip.lizchip { display: none; }
.chip.lizchip.an { display: inline-block; background: var(--figma-color-bg-secondary, #f0f0f3);
  color: var(--figma-color-text-secondary, #6e6e76); }
.chip.lizchip.voll { background: rgba(18,167,106,.14); color: #0e8a57; }
.chip.lizchip.test { background: rgba(201,138,18,.16); color: #8a6208; }
.chip.lizchip.aus { background: rgba(194,64,42,.12); color: #c2402a; }

/* ---- Felder mit Hilfezeile ---------------------------------------------- */
.feldgruppe { display: flex; flex-direction: column; gap: 3px; }
.feld > fig-tooltip { flex: 1; min-width: 0; display: block; }
.feld > fig-tooltip > * { width: 100%; }
.fhilfe { font-size: 9.5px; line-height: 1.45;
  color: var(--figma-color-text-secondary, #6e6e76); }
.fhilfe[hidden] { display: none; }
.vier .feldgruppe .feld > .fname { width: 62px; }

/* Größen-Karte: Feld = Label, Steuerung, Hilfezeile untereinander */
.gfeld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.gfeld[hidden] { display: none; }
.gfeld > .fname { color: var(--figma-color-text-secondary, #6e6e76); }
.gfeld > fig-tooltip { display: block; }
.gfeld > fig-tooltip > * { width: 100%; }
.gzeilen { gap: 8px 12px; }
.groessekarte { padding: 12px; gap: 8px; }
.gkopf .gtitel { font-size: 11px; }

/* ---- Farbe / Token-Liste ------------------------------------------------ */
#farbeErkl { margin-top: -2px; }
.varzeile fig-skeleton, .varladen fig-skeleton { width: 16px; height: 16px;
  border-radius: 3px; flex: none; display: block; }
.varzeile fig-swatch { flex: none; }
fig-group.kollektion .varzeile { padding-left: 8px; }
.varladen { display: flex; align-items: center; gap: 8px; padding: 4px 6px; }
.varladen fig-shimmer { font-size: 9.5px; }

/* ---- Lizenz-Block ------------------------------------------------------- */
/* Karte mit Skizze links, Text rechts — Grafik aus src/ui/inhalte/lizenz.mjs */
.lizkopf { display: flex; align-items: flex-start; gap: 12px; }
.lizbild { flex: none; width: 64px; height: 48px; }
.lizbild svg { display: block; width: 64px; height: 48px; }
.lizkopftext { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lizinhtitel { font-size: 11px; font-weight: 700; }
.lizkarte { display: flex; flex-direction: column; gap: 8px; padding: 12px;
  border: 1px solid var(--figma-color-border, #e3e3e6); border-radius: 8px; cursor: default; }
.lizzeile { display: flex; align-items: center; gap: 8px; }
.lizmodell { font-size: 11px; font-weight: 700; }
#lizDebug { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
#lizDebug[hidden] { display: none; }

/* ---- Startseite (kein Ziel ausgewählt) ---------------------------------- */
.startseite { display: flex; flex-direction: column; gap: 12px; }
.start-kopf { display: flex; align-items: center; gap: 8px; }
.start-kopf .stitel { font-size: 11px; font-weight: 700; }
.start-kopf .schip { margin-left: auto; }
.start-summe { font-size: 9.5px; color: var(--figma-color-text-secondary, #6e6e76);
  font-variant-numeric: tabular-nums; }
.start-suche { width: 100%; }
.ikarten { display: flex; flex-direction: column; gap: 4px;
  max-height: 232px; overflow-y: auto; }
.ikarte { display: flex; align-items: center; gap: 8px; padding: 7px 9px;
  border: 1px solid var(--figma-color-border, #e3e3e6); border-radius: 7px;
  cursor: pointer; background: var(--figma-color-bg, #fff); }
.ikarte:hover { background: var(--figma-color-bg-secondary, #f0f0f3); }
.ikarte .iname { flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.ikarte .igroessen { flex: none; font-size: 9.5px; font-variant-numeric: tabular-nums;
  color: var(--figma-color-text-secondary, #6e6e76); }
.ikarte .chip { flex: none; }
.startleer { font-size: 10px; font-style: italic;
  color: var(--figma-color-text-tertiary, #9a9aa0); padding: 4px 2px; }

/* Checkliste „Erste Schritte“ */
.eskarte { display: flex; flex-direction: column; gap: 6px; padding: 12px;
  border: 1px solid var(--figma-color-border, #e3e3e6); border-radius: 8px;
  background: var(--figma-color-bg-secondary, #fafafc); }
.eskarte[hidden] { display: none; }
.eskopf { display: flex; align-items: center; gap: 8px; }
.eskopf .estitel { font-size: 11px; font-weight: 700; }
.eskopf fig-button { margin-left: auto; font-size: 9.5px; height: 18px; }
.esliste { display: flex; flex-direction: column; gap: 4px; }
.eszeile { display: flex; align-items: center; gap: 7px; font-size: 10.5px;
  color: var(--figma-color-text-secondary, #6e6e76); }
.eszeile .haken { width: 13px; height: 13px; border-radius: 50%; flex: none;
  border: 1px solid var(--figma-color-border, #cfcfd6); display: flex;
  align-items: center; justify-content: center; font-size: 8px; color: transparent; }
.eszeile.fertig { color: var(--figma-color-text, #1c1c22); }
.eszeile.fertig .haken { background: #12a76a; border-color: #12a76a; color: #fff; }

/* ---- Bühne: Onboarding-Slideshow und Lizenz-Screen ---------------------- */
dialog[is="fig-dialog"].buehne-dlg {
  position: fixed; inset: 0; width: 100%; height: 100%;
  max-width: none; max-height: none; margin: 0; padding: 0; border-radius: 0;
  background: var(--figma-color-bg, #fff);
  display: flex; flex-direction: column; overflow: hidden;
}
dialog[is="fig-dialog"].buehne-dlg:not([open]) { display: none; }
.bh-bild { position: relative; flex: none; height: 200px;
  display: flex; align-items: center; padding: 0 20px;
  background-color: #221f2b;
  background-image:
    repeating-linear-gradient(to right,  rgba(255,255,255,.075) 0 1px, transparent 1px 16px),
    repeating-linear-gradient(to bottom, rgba(255,255,255,.075) 0 1px, transparent 1px 16px),
    radial-gradient(120% 120% at 18% 20%, #2f2a3d 0%, #1d1b25 70%);
  transition: opacity .18s ease;
}
/* Welcome-Screen: volle Bildbühne, die Grafik füllt sie randlos (§39.8). */
dialog[is="fig-dialog"].buehne-dlg.welcome .bh-bild { height: 240px; padding: 0; display: block; }
.bh-bild > svg { display: block; width: 100%; height: 100%; }
.bh-bild .marke-gross { width: 96px; height: 96px; border-radius: 22px; flex: none;
  background: linear-gradient(160deg, #3a3350, #262233);
  box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
  display: flex; align-items: center; justify-content: center; }
.bh-bild .skizze { display: flex; align-items: center; gap: 10px; margin-left: 16px; }
.bh-bild .skizze svg { border-radius: 5px; background: rgba(255,255,255,.04);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.bh-bild .pfeil { color: rgba(255,255,255,.45); font-size: 13px; }
.bh-bild .bunt { color: #cfc9e6; font-size: 9.5px; letter-spacing: .06em;
  text-transform: uppercase; font-weight: 700; }
.bh-x { position: absolute; top: 10px; right: 10px; z-index: 2; color: #e7e3f4; }
.bh-text { padding: 16px 20px 0; transition: opacity .18s ease; }
.bh-zaehler { font-size: 9.5px; font-weight: 700; letter-spacing: .08em;
  color: var(--figma-color-text-tertiary, #9a9aa0); margin-bottom: 6px; }
.bh-titel { font-size: 26px; line-height: 1.15; font-weight: 700; margin: 0 0 8px;
  letter-spacing: -.01em; text-wrap: balance; }
.bh-fliess { font-size: 14px; line-height: 1.5; margin: 0;
  color: var(--figma-color-text-secondary, #6e6e76); }
.bh-extra { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.bh-extra .profilliste { padding: 0; max-height: 150px; }
.bh-wechsel .bh-bild, .bh-wechsel .bh-text { opacity: 0; }
.bh-zaehler[hidden] { display: none; }
.bh-x[hidden] { display: none; }
.bh-dots[hidden] { display: none; }
.welcome .bh-titel { font-size: 28px; }
.bh-dots { display: flex; gap: 7px; justify-content: center; padding: 16px 0 4px; }
.bh-dots button { appearance: none; border: 0; padding: 0; cursor: pointer;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--figma-color-border, #d9d9de); transition: all .18s ease; }
.bh-dots button.an { width: 16px; border-radius: 4px;
  background: var(--figma-color-bg-brand, #0d99ff); }
.bh-knoepfe { display: flex; flex-direction: column; gap: 8px;
  padding: 8px 20px 12px; margin-top: auto; }
.bh-knoepfe.zwei { flex-direction: row; }
.bh-knoepfe fig-button { flex: 1; height: 44px; font-size: 12px; }
.bh-hinweis { display: flex; align-items: flex-start; gap: 8px; cursor: default;
  margin: 0 20px 16px; padding: 12px; border-radius: 8px;
  border: 1px solid var(--figma-color-border, #e3e3e6);
  background: var(--figma-color-bg-secondary, #fafafc);
  font-size: 10px; line-height: 1.5; color: var(--figma-color-text-secondary, #6e6e76); }
.bh-hinweis .punkt { width: 7px; height: 7px; border-radius: 50%; flex: none;
  margin-top: 4px; background: #12a76a; }

/* ---- Umfang-Umschalter, Fazit, Rückgängig (Runde 5, §34/§35) ------------ */
.umfang { flex: none; width: 100%; height: 24px; }
#grpLibrary[hidden] { display: none; }
#grpIcon[hidden] { display: none; }
.libsumme { font-size: 10.5px; line-height: 20px; font-variant-numeric: tabular-nums;
  color: var(--figma-color-text-secondary, #6e6e76); }
.fazitzeile { display: flex; align-items: center; gap: 8px; flex: none; min-height: 0; }
.fazitzeile fig-button { height: 22px; font-size: 10px; }
.fazitzeile .fazit { flex: 1; }
.fazitzeile fig-tooltip { display: inline-flex; flex: none; }
.fazitzeile fig-button[hidden] { display: none; }
#btnUndoLog[hidden] { display: none; }
#btnUndoLog { min-width: 22px; }
.leerzustand .fhilfe { margin: 0; }
.lizknoepfe { display: flex; gap: 8px; align-items: center; }
.lizknoepfe fig-button[hidden] { display: none; }

/* 30-bericht.css */
  /* =======================================================================
     Runde 4 / UI-2 — Bericht, Protokoll, Vorschau, Fortschritt
     Ruhige Karten statt dichter Tabellen: Abstände 8/12/16, weiche Schatten,
     6 px Radius, Status als kleine Chips, nur eine primäre Aktion je Panel.
     ======================================================================= */

  /* ---- Fortschritt ------------------------------------------------------ */
  .fortschritt .zahl.rest { color: var(--figma-color-text-tertiary, #9a9aa0); }

  /* ---- Icon-Tab: flache Abschnitte mit 1-px-Trennern (§39.7) ------------ */
  /* Keine Kästen in Kästen: die Abschnitte trennt eine Linie, nicht ein
     Rahmen. Titel 11 px halbfett, Werte tabular, Abstände 8/12. */
  .abschnitt { display: flex; flex-direction: column; gap: 8px; flex: none;
    padding: 8px 0; border-bottom: 1px solid var(--figma-color-border, #e3e3e6); }
  .abschnitt[hidden] { display: none; }
  .kopfabschnitt { gap: 8px; }
  .titelzeile { display: flex; align-items: center; gap: 8px; min-height: 22px; }
  .titelzeile[hidden] { display: none; }
  .titelzeile .tname { font-size: 12px; font-weight: 700; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titelzeile .tname.leer { font-weight: 400; color: var(--figma-color-text-secondary, #6e6e76); }
  .titelzeile > fig-tooltip { margin-left: auto; display: inline-flex; flex: none; }
  .titelzeile .chip { flex: none; }
  .titelzeile #auswahl[hidden] { display: none; }
  .chip.klassechip.klickbar { cursor: pointer; }
  .chip.klassechip.klickbar:hover { background: var(--figma-color-bg-hover, #ebebef); }
  dialog.klassemenu { display: flex; flex-direction: column; gap: 2px; padding: 8px;
    border: 1px solid var(--figma-color-border, #e3e3e6); border-radius: 8px;
    background: var(--figma-color-bg, #fff); box-shadow: 0 4px 14px rgba(0,0,0,.18);
    max-width: 240px; }
  dialog.klassemenu:not([open]) { display: none; }
  dialog.klassemenu .kmkopf { font-size: 9.5px; line-height: 1.45; padding: 2px 4px 6px;
    color: var(--figma-color-text-secondary, #6e6e76); }
  dialog.klassemenu fig-button { justify-content: flex-start; height: 22px; font-size: 10.5px; }
  .aktionsreihe { display: flex; align-items: center; gap: 8px; }
  .aktionsreihe .agruppe { display: flex; gap: 8px; flex: 1; min-width: 0; }
  .aktionsreihe .agruppe[hidden] { display: none; }
  .aktionsreihe .agruppe fig-button { flex: 1; height: 28px; }
  .aktionsreihe > fig-tooltip { display: inline-flex; flex: none; }
  .aktionsreihe .iknopf { flex: none; width: 28px; min-width: 28px; height: 28px;
    padding: 0; font-size: 12px; }
  .iknopf { width: 24px; min-width: 24px; height: 24px; padding: 0; font-size: 11px; }
  .iknopf.an { background: var(--figma-color-bg-brand-tertiary, rgba(13,153,255,.16));
    color: var(--figma-color-text-brand, #0d99ff); }
  .iknopf[hidden] { display: none; }
  .abschnitt.optzeile { flex-direction: row; align-items: center; gap: 16px;
    height: auto; overflow: visible; }
  dialog.mehrmenu { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px;
    border: 1px solid var(--figma-color-border, #e3e3e6); border-radius: 8px;
    background: var(--figma-color-bg, #fff); box-shadow: 0 4px 14px rgba(0,0,0,.18);
    max-width: 240px; }
  dialog.mehrmenu:not([open]) { display: none; }
  dialog.mehrmenu fig-switch { font-size: 9.5px; white-space: nowrap; }
  dialog.mehrmenu fig-tooltip { display: block; }
  dialog.mehrmenu fig-button { justify-content: flex-start; height: 22px; font-size: 10.5px; }

  /* ---- Bühne: Canvas-Viewport mit schwebenden Werkzeugen ----------------- */
  .buehne { position: relative; flex: 1 1 auto; min-height: 280px;
    overflow: hidden; border-radius: 8px;
    border: 1px solid var(--figma-color-border, #e3e3e6);
    background: var(--figma-color-bg-secondary, #fafafc);
    touch-action: none; user-select: none; }
  .buehne canvas { display: block; width: 100%; height: 100%; }
  .buehne.zieht { cursor: grabbing; }
  .buehne.raum { cursor: grab; }
  .vptip { position: absolute; z-index: 6; pointer-events: none; max-width: 220px;
    font-size: 9px; font-variant-numeric: tabular-nums; padding: 3px 7px; border-radius: 4px;
    background: var(--figma-color-bg-inverse, #1e1e1e);
    color: var(--figma-color-text-oninverse, #fff);
    box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .vptip[hidden] { display: none; }
  /* Schwebende Overlays: in den vier Ecken der Bühne, wie in Figma. */
  .ovl { position: absolute; z-index: 5; display: flex; align-items: center; gap: 4px;
    padding: 3px; border-radius: 9px;
    background: color-mix(in srgb, var(--figma-color-bg, #fff) 88%, transparent);
    border: 1px solid var(--figma-color-border, #e3e3e6);
    box-shadow: 0 1px 6px rgba(0,0,0,.14); }
  .ovl[hidden] { display: none; }
  .ovl-ol { left: 8px; top: 8px; }
  .ovl-or { right: 8px; top: 8px; }
  .ovl-ul { left: 8px; bottom: 8px; }
  .ovl-ur { right: 8px; bottom: 8px; }
  .ovl fig-segmented-control { height: 22px; font-size: 10px; }
  .ovl fig-segment { font-size: 10px; white-space: nowrap; }
  .ovl fig-button { font-size: 9.5px; height: 22px; }
  .ovl-ul fig-button { border-radius: 9px; font-variant-numeric: tabular-nums; }
  .zoompille > fig-button { font-size: 9.5px; height: 22px; border-radius: 9px;
    font-variant-numeric: tabular-nums; min-width: 22px; }
  .zoommenu { position: absolute; right: 0; bottom: 30px; display: flex; flex-direction: column;
    gap: 2px; padding: 4px; border-radius: 8px; min-width: 88px;
    border: 1px solid var(--figma-color-border, #e3e3e6);
    background: var(--figma-color-bg, #fff); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .zoommenu[hidden] { display: none; }
  .zoommenu fig-button { font-size: 9.5px; height: 20px; justify-content: flex-start; }
  .bhgriff { position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
    cursor: ns-resize; z-index: 3; }
  .bhgriff::after { content: ""; position: absolute; left: 50%; bottom: 2px;
    width: 26px; height: 3px; margin-left: -13px; border-radius: 2px;
    background: var(--figma-color-border, #d9d9de); }

  /* ---- Unter der Bühne: flache Zeilen mit Trennern ----------------------- */
  .vzeile { display: flex; align-items: center; gap: 8px; flex: none; min-height: 24px;
    padding: 4px 0; border-bottom: 1px solid var(--figma-color-border, #e3e3e6); }
  .vzeile[hidden] { display: none; }
  .vzeile:last-of-type { border-bottom: none; }
  .vzeile .vlabel { font-size: 9.5px; white-space: nowrap; flex: none;
    color: var(--figma-color-text-secondary, #6e6e76); }
  #scrubberZeile fig-slider { flex: 1; }
  #basisZeile fig-tooltip { display: inline-flex; }
  #basisZeile fig-segmented-control { height: 22px; font-size: 10px; }

  .urteilzeile .upunkt { width: 7px; height: 7px; border-radius: 50%; flex: none;

fig-select-options,
.fig-menu-options {
  --fig-vertical-overflow-size: var(--spacer-4);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 0;
  width: 100%;
  max-width: 100%;
  max-height: calc(100vh - 1rem);
  padding: 0;
  overflow: hidden auto;
  scrollbar-width: none;
}
fig-select-options::-webkit-scrollbar,
.fig-menu-options::-webkit-scrollbar {
  display: none;
}
fig-select-options > :not(.fig-overflow),
.fig-menu-options > :not(.fig-overflow) {
  flex-shrink: 0;
}
fig-select-options > :nth-child(1 of :not(.fig-overflow)),
.fig-menu-options > :nth-child(1 of :not(.fig-overflow)) {
  margin-top: var(--spacer-2);
}
fig-select-options > :not(.fig-overflow):last-child,
.fig-menu-options > :not(.fig-overflow):last-child,
fig-select-options > :not(.fig-overflow):has(+ .fig-overflow-end),

  margin-bottom: var(--spacer-2);
}
fig-select-options > .fig-overflow,
.fig-menu-options > .fig-overflow {
  all: unset;
  box-sizing: border-box;
  position: sticky;
  left: 0;
  z-index: 3;
  flex: 0 0 var(--fig-vertical-overflow-size);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: var(--fig-vertical-overflow-size);
  margin: 0;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  color: var(--figma-color-text-menu);
  background: var(--figma-color-bg-menu) !important;
}
fig-select-options > .fig-overflow::before,
.fig-menu-options > .fig-overflow::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: 0;
  background: var(--figma-color-bg-menu) !important;
}
fig-select-options > .fig-overflow:hover,
.fig-menu-options > .fig-overflow:hover {
  color: var(--figma-color-text-menu);
}
fig-select-options > .fig-overflow:hover::before,
.fig-menu-options > .fig-overflow:hover::before {
  background: light-dark(
    rgba(0, 0, 0, 0.06),
    rgba(255, 255, 255, 0.08)
  ) !important;
}
fig-select-options > .fig-overflow .fig-overflow-chevron,
.fig-menu-options > .fig-overflow .fig-overflow-chevron {
  position: relative;
}
fig-select-options > .fig-overflow:active .fig-overflow-chevron,
.fig-menu-options > .fig-overflow:active .fig-overflow-chevron {

fig-select-options.overflow-start > .fig-overflow-start,
.fig-menu-options.overflow-start > .fig-overflow-start,
fig-select-options.overflow-end > .fig-overflow-end,
.fig-menu-options.overflow-end > .fig-overflow-end {
  opacity: 1;
  pointer-events: auto;
}
fig-select-options > .fig-overflow-start,
.fig-menu-options > .fig-overflow-start {
  order: -1;
  top: 0;
  margin-block-end: calc(-1 * var(--fig-vertical-overflow-size));
}
fig-select-options > .fig-overflow-start::before,
.fig-menu-options > .fig-overflow-start::before {

}

  margin-block-start: calc(-1 * var(--fig-vertical-overflow-size));
}

offset=\"1\" stop-color=\"#1b1922\"/>\n    \u003c/linearGradient>\n  \u003c/defs>\n  \u003crect width=\"320\" height=\"240\" fill=\"url(#wGrund)\"/>\n  \u003crect width=\"320\" height=\"240\" fill=\"url(#wGitter)\"/>\n  \u003cg transform=\"translate(40 68)\">\n    \u003crect x=\"0\" y=\"56\" width=\"28\" height=\"28\" rx=\"6\" fill=\"#0d99ff\" fill-opacity=\".45\"/>\n    \u003crect x=\"36\" y=\"40\" width=\"44\" height=\"44\" rx=\"9\" fill=\"#0d99ff\" fill-opacity=\".7\"/>\n    \u003crect x=\"88\" y=\"16\" width=\"68\" height=\"68\" rx=\"14\" fill=\"#0d99ff\"/>\n  \u003c/g>\n  \u003cg fill=\"none\" stroke=\"#8a8a96\" stroke-width=\"2\" stroke-linecap=\"round\">\n    \u003cpath d=\"M214 96 h28 m-8 -8 l8 8 l-8 8\"/>\n  \u003c/g>\n  \u003cg fill=\"none\" stroke=\"#ffffff\" stroke-opacity=\".8\" stroke-width=\"2\">\n    \u003crect x=\"256\" y=\"64\" width=\"40\" height=\"40\" rx=\"8\"/>\n    \u003crect x=\"256\" y=\"116\" width=\"30\" height=\"30\" rx=\"7\"/>\n    \u003crect x=\"256\" y=\"158\" width=\"22\" height=\"22\" rx=\"5\"/>\n  \u003c/g>\n\u003c/svg>","titel":{"de":"Willkommen bei Icon Pipeline","en":"Welcome to Icon Pipeline"},"text":{"de":"Aus einer Vorlage entstehen alle Zielgrößen — pixelgenau gerastert und als Varianten abgelegt.","en":"One source becomes every target size — snapped to the pixel grid and stored as variants."},"primaer":{"de":"Rundgang starten","en":"Start the tour"},"sekundaer":{"de":"Direkt loslegen","en":"Jump right in"}}};
  // Zweisprachiges Feld aus den Inhalten: { de, en } → Text in der UI-Sprache.
  function inh(feld, params) {
    if (feld == null) return '';
    const s = typeof feld === 'string' ? feld : (feld[SPR] != null ? feld[SPR] : (feld.en || feld.de || ''));
    if (!params) return s;
    let r = s;
    Object.keys(params).forEach(k => { r = r.split('{' + k + '}').join(String(params[k])); });
    return r;
  }
  const KLASSEN = ['Square', 'Circular', 'Wide', 'Tall'];
  const RASTER_WERTE = [1, 0.5, 0.25];

  function navSprache() {
    const s = (navigator.language || 'en').toLowerCase();
    return s.indexOf('de') === 0 ? 'de' : 'en';
  }
  let SPR = navSprache();
  function t(key, params) {
    const tab = T[SPR] || T.en;
    let s = tab[key];
    if (s == null) s = (T.en[key] == null ? key : T.en[key]);
    if (params) Object.keys(params).forEach(k => {
      s = s.split('{' + k + '}').join(String(params[k]));
    });
    return s;
  }
  // Zahl in der jeweiligen Sprache (Dezimaltrennzeichen).
  function zahl(v) {
    if (v == null || v === '') return '?';
    const s = String(v);
    return SPR === 'de' ? s.replace('.', ',') : s;
  }

  // Werte an figui3-Elemente: immer über Attribute, das Modul lädt erst nach
  // diesem Skript und liest beim Upgrade die Attribute.
  function wert(el, v) {
    if (!el) return;
    el.setAttribute('value', v == null ? '' : String(v));
    try { el.value = v; } catch (e) {}
  }
  function anhaken(el, an) {
    if (!el) return;
    el.toggleAttribute('checked', !!an);
    try { el.checked = !!an; } catch (e) {}
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .split('&').join('&amp;').split('<').join('&lt;')
      .split('>').join('&gt;').split('"').join('&quot;');
  }

  let beschaeftigt = false, hatAuswahl = false;
  let ziel = null;                 // letztes Ziel-Objekt aus 'auswahl'
  let letzterDiff = null, dunkel = false;
  let logListe = [];
  let KONFIG = null, cfgLokal = null, adapterAktiv = '', konfigFehler = [];
  let farben = null, farbenAngefragt = false, farbSuche = '';
  let wartetAufSpeichern = false;
  let keylinesOffen = {};
  let profile = ['zds', 'generic'], profilInfo = null, profilWahl = 'generic';
  let planDaten = null, planUmfang = 'alle', trockenlaufEinzel = false;
  let bericht = null, berichtSort = { spalte: 'name', ab: false };
  let exportFehlend = [];


  // ===== 20-sprache.js =====
  // =========================================================================
  // Sprache / Texte
  // =========================================================================
  function effektiveSprache() {
    const s = KONFIG && KONFIG.sprache;
    if (!s || s === 'auto') return navSprache();
    return s === 'de' ? 'de' : 'en';
  }
  function texteSetzen() {
    document.querySelectorAll('[data-t]').forEach(el => {
      el.textContent = t(el.getAttribute('data-t'));
    });
    document.querySelectorAll('[data-t-text]').forEach(el => {
      el.setAttribute('text', t(el.getAttribute('data-t-text')));
    });
    document.querySelectorAll('[data-t-ph]').forEach(el => {
      el.setAttribute('placeholder', t(el.getAttribute('data-t-ph')));
    });
    document.querySelectorAll('[data-t-title]').forEach(el => {
      el.setAttribute('title', t(el.getAttribute('data-t-title')));
    });
    document.querySelectorAll('[data-t-label]').forEach(el => {
      el.setAttribute('label', t(el.getAttribute('data-t-label')));
    });
    // Dropdowns spiegeln ihre <option>-Kinder in ein internes <select> —
    // nach Textwechsel neu einlesen lassen.
    document.querySelectorAll('fig-dropdown').forEach(d => {
      try { if (typeof d.slotChange === 'function') d.slotChange(); } catch (e) {}
    });
    auswahlZeichnen();
    protokollZeichnen();
    adapterChipSetzen();
    if (cfgLokal) { masterZeichnen(); groessenZeichnen(); farbeZeichnen(); schreibenZeichnen(); }
    fehlerZeichnen();
    profilListeZeichnen();
    planZeichnen();
    berichtZeichnen();
    if (letzterDiff) renderDiff();
  }
  function spracheAbgleichen() {
    const neu = effektiveSprache();
    if (neu === SPR) return false;
    SPR = neu;
    texteSetzen();
    return true;
  }


  // ===== 30-tabs.js =====
  // =========================================================================
  // Tabs
  // =========================================================================
  function panelsSetzen(v) {
    $('panelIcon').hidden = v !== 'icon';
    $('panelBericht').hidden = v !== 'bericht';
    $('panelCfg').hidden = v !== 'cfg';
    if (v === 'cfg') {
      if (!KONFIG) send({ type: 'konfigLaden' });
      if (cfgLokal && cfgLokal.farbe && cfgLokal.farbe.modus === 'variable') farbenAnfordern();
    }
    // Library-Ansicht im Icon-Tab: Liste auffrischen (gedrosselt auf 2 s).
    if (v === 'icon') uebersichtAnfordern();
  }
  // Tab von Hand umschalten (fig-tabs spiegelt das value-Attribut auf die Kinder).
  function tabWechseln(v) {
    const tabs = $('tabs');
    if ((tabs.getAttribute('value') || '') !== v) tabs.setAttribute('value', v);
    document.querySelectorAll('#tabs fig-tab').forEach(tb => {
      const an = tb.getAttribute('value') === v;
      if (an) tb.setAttribute('selected', 'true'); else tb.removeAttribute('selected');
    });
    panelsSetzen(v);
  }
  $('tabs').addEventListener('change', e => {
    panelsSetzen((e && e.detail) || $('tabs').value || 'icon');
  });


  // ===== 40-auswahl.js =====
  // =========================================================================
  // Kopf / Auswahl / Startseite
  // =========================================================================
  function adapterChipSetzen() {
    const c = $('adapterChip');
    if (!adapterAktiv) { c.textContent = ''; c.className = 'chip kopfchip'; return; }
    c.className = 'chip grau kopfchip';
    c.textContent = adapterAktiv === 'zds' ? t('adapter.zds') : t('adapter.frei');
  }
  function chipLeeren() { const c = $('auswahlStatus'); c.className = 'chip'; c.textContent = ''; }

  // Titelzeile: Name, Klassen-Chip, Status-Chip (§39.7b). Die Klasse ist kein
  // eigenes Feld mehr — im ZDS-Modus steht sie fest (sie kommt aus dem Grid),
  // im freien Modus öffnet der Chip ein kleines Menü mit den vier Klassen.
  function auswahlZeichnen() {
    const txt = $('auswahlText');
    txt.textContent = hatAuswahl && ziel ? ziel.name : t('auswahl.leer');
    txt.className = 'tname' + (hatAuswahl ? '' : ' leer');
    $('auswahl').hidden = !hatAuswahl;

    const frei = !!(ziel && ziel.adapter === 'frei');
    const geraten = !!(ziel && ziel.klasseQuelle === 'heuristik');
    const kchip = $('klasseChip');
    if (hatAuswahl && ziel && ziel.klasse) {
      kchip.className = 'chip grau klassechip' + (frei ? ' klickbar' : '');
      kchip.textContent = ziel.klasse + (geraten ? ' ?' : '');
      kchip.title = geraten ? t('klasse.geratenTip') : (frei ? t('klasse.wechselnTip') : t('klasse.festTip'));
    } else { kchip.className = 'chip klassechip'; kchip.textContent = ''; kchip.title = ''; }
    if (!frei) klasseMenuSetzen(false);
    leerzustandZeichnen();
  }

  // ---- Klassen-Menü (nur Frei-Modus) --------------------------------------
  function klasseMenuSetzen(auf) {
    const m = $('klasseMenu');
    if (!m) return;
    try { m.open = auf; } catch (e) { if (auf) m.setAttribute('open', 'true'); else m.removeAttribute('open'); }
  }
  $('klasseChip').addEventListener('click', e => {
    if (!hatAuswahl || beschaeftigt) return;
    if (!ziel || ziel.adapter !== 'frei') return;
    e.stopPropagation();
    klasseMenuSetzen(!$('klasseMenu').open);
  });
  $('klasseMenu').addEventListener('click', e => {
    const b = e.target.closest('[data-klasse]');
    if (!b) return;
    klasseMenuSetzen(false);
    const k = b.getAttribute('data-klasse');
    if (!k || beschaeftigt || !hatAuswahl || (ziel && ziel.klasse === k)) return;
    send({ type: 'klasseSetzen', klasse: k });
  });
  document.addEventListener('click', e => {
    if ($('klasseMenu').open && !$('klasseMenu').contains(e.target) && e.target !== $('klasseChip')) {
      klasseMenuSetzen(false);
    }
  }, true);

  // ---- Startseite ---------------------------------------------------------
  // Ohne Ziel zeigt der Icon-Tab eine Startseite: Begrüßung mit Modus-Chip,
  // Checkliste „Erste Schritte“, Suchfeld und die Liste aller Icons im File.
  // Die Daten liefert der Hauptthread auf `uebersicht`.
  let uebersichtDaten = null, uebersichtZeit = 0, uebersichtTimer = null;
  let startSuche = '', startAufgebaut = false;

  function uebersichtAnfordern(sofort) {
    const jetzt = Date.now();
    const rest = 2000 - (jetzt - uebersichtZeit);
    if (!sofort && rest > 0) {                       // höchstens alle 2 s
      if (!uebersichtTimer) uebersichtTimer = setTimeout(() => {
        uebersichtTimer = null; uebersichtAnfordern(true);
      }, rest);
      return;
    }
    uebersichtZeit = jetzt;
    send({ type: 'uebersicht' });
  }
  bei('uebersicht', m => { uebersichtDaten = m; startseiteFuellen(); libSummeZeichnen(); });
  bei('fazit', () => uebersichtAnfordern());
  // Beim Start (erste `konfig`-Antwort) einmal holen — davor kennt der
  // Hauptthread weder Konfig noch Adapter.
  bei('konfig', () => uebersichtAnfordern(true));

  // ---- Umfang: Dieses Icon | Ganze Library (§34) --------------------------
  // Der Umschalter ersetzt die früheren Gruppen. „Ganze Library“ ist zugleich
  // die Startseite: die Icon-Liste steht dort, wo sonst die Vorschau liegt.
  let umfang = 'icon', ausListe = false;
  // Klick in der Library-Liste führt ins Icon: dort steht die Vorschau.
  bei('auswahl', m => {
    if (!ausListe) return;
    ausListe = false;
    if (m && m.ziel) umfangSetzen('icon', true);
  });
  function umfangAnwenden(melden) {
    const lib = umfang === 'library';
    $('grpIcon').hidden = lib;
    $('grpLibrary').hidden = !lib;
    $('titelzeile').hidden = lib;
    $('libSumme').hidden = !lib;
    try { $('segUmfang').setAttribute('value', umfang); } catch (e) {}
    if (lib) uebersichtAnfordern();
    libSummeZeichnen();
    leerzustandZeichnen();
    if (melden) send({ type: 'merkerSetzen', schluessel: 'umfang', wert: umfang });
  }
  function umfangSetzen(v, melden) {
    const neu = v === 'library' ? 'library' : 'icon';
    if (neu === umfang) return;
    umfang = neu;
    umfangAnwenden(melden);
  }
  function libSummeZeichnen() {
    const z = (uebersichtDaten && uebersichtDaten.zusammenfassung) || null;
    $('libSumme').textContent = z
      ? t('start.summe', { icons: z.icons || 0, ohneSet: z.ohneSet || 0, veraltet: z.veraltet || 0 })
      : t('start.laden');
  }
  $('segUmfang').addEventListener('change', e => {
    umfangSetzen(String((e && e.detail) || $('segUmfang').value || 'icon'), true);
  });
  bei('merker', m => {
    if (!m || m.schluessel !== 'umfang') return;
    if (m.wert !== 'icon' && m.wert !== 'library') return;
    umfang = m.wert;
    umfangAnwenden(false);
  });
  send({ type: 'merkerLaden', schluessel: 'umfang' });

  function startseiteAufbauen() {
    if (startAufgebaut) return;
    const box = $('leerzustand');
    const s = document.createElement('div');
    s.className = 'startseite';
    s.id = 'startseite';
    s.innerHTML =
      '<div class="fhilfe" id="startHinweis"></div>'
      + '<div id="esKarte"></div>'
      + '<div class="start-kopf"><span class="stitel" id="startTitel"></span>'
      + '<span class="chip grau schip" id="startModus"></span></div>'
      + '<fig-input-text id="startSuche" type="search" class="start-suche"></fig-input-text>'
      + '<div class="start-summe" id="startSumme"></div>'
      + '<div class="ikarten" id="startListe"></div>';
    box.insertBefore(s, $('btnBeispiel'));
    $('startSuche').addEventListener('input', e => {
      startSuche = String((e && e.detail != null) ? e.detail : $('startSuche').value || '');
      startListeZeichnen();
    });
    startAufgebaut = true;
  }

  function startseiteFuellen() {
    if (!startAufgebaut) return;
    $('startHinweis').textContent = t('start.hinweis');
    $('startTitel').textContent = t('start.titel');
    $('startModus').textContent = adapterAktiv === 'zds' ? t('adapter.zds') : t('adapter.frei');

  // ===== 60-protokoll.js =====
  // =========================================================================
  // Protokoll — nach Icon gruppiert, Filter, Suche, Kopieren
  // =========================================================================
  // Die Nachricht `log` trägt seit Runde 4 zusätzlich `name`, `N` und
  // `schwere`. 95-nachrichten.js legt den Eintrag an (art/text/hinweis/nodeId);
  // der Handler hier ergänzt die neuen Felder am zuletzt angelegten Eintrag.
  let logFilter = 'alle';        // alle | err | warn | info | ok
  let logSuche = '';
  let logZu = {};                // Gruppenname → true, wenn zugeklappt
  let logMalGeplant = false;

  bei('log', m => {
    const e = logListe[logListe.length - 1];
    if (e) {
      e.name = m.name || '';
      e.N = (m.N == null ? null : m.N);
      e.schwere = m.schwere || '';
      e.code = m.code || '';
    }
    protokollZeichnen();
  });

  function logLeeren() { logListe = []; logZu = {}; protokollZeichnen(); }

  // Zeichnen wird auf einen Frame gebündelt: bei 76 Icons kommen Logzeilen
  // im Bündel, jede einzeln zu rendern wäre verschwendet.
  function protokollZeichnen() {
    if (logMalGeplant) return;
    logMalGeplant = true;
    requestAnimationFrame(() => { logMalGeplant = false; protokollMalen(); });
  }

  function logGruppe(e) { return e.name || t('log.allgemein'); }
  function logArt(e) { return e.art || 'info'; }
  function logPasst(e) {
    if (logFilter !== 'alle' && logArt(e) !== logFilter) return false;
    if (!logSuche) return true;
    const s = (e.text + ' ' + (e.hinweis || '') + ' ' + (e.name || '') + ' ' + (e.code || '')).toLowerCase();
    return s.indexOf(logSuche) >= 0;
  }
  // Gruppen in der Reihenfolge des ersten Auftretens.
  function logGruppen() {
    const namen = [], nach = {};
    logListe.filter(logPasst).forEach(e => {
      const g = logGruppe(e);
      if (!nach[g]) { nach[g] = []; namen.push(g); }
      nach[g].push(e);
    });
    return namen.map(n => {
      const eintraege = nach[n];
      let err = 0, warn = 0, info = 0;
      eintraege.forEach(e => {
        const a = logArt(e);
        if (a === 'err') err++; else if (a === 'warn') warn++; else if (a !== 'ok') info++;
      });
      return { name: n, eintraege: eintraege, err: err, warn: warn, info: info };
    });
  }

  function logEintragEl(e) {
    const d = document.createElement('div');
    d.className = 'logzeile ' + logArt(e);
    const kopf = document.createElement('div');
    kopf.className = 'lztext';
    if (e.N != null && isFinite(e.N)) {
      const g = document.createElement('span');
      g.className = 'chip grau lzn';
      g.textContent = t('log.groesse', { n: zahl(e.N) });
      kopf.appendChild(g);
    }
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = e.text;
    kopf.appendChild(txt);
    if (e.nodeId) {
      const a = document.createElement('span');
      a.className = 'zeigen';
      a.textContent = t('log.zeigen');
      a.addEventListener('click', () => send({ type: 'fokus', nodeId: e.nodeId }));
      kopf.appendChild(a);
    }
    d.appendChild(kopf);
    if (e.hinweis) {
      const h = document.createElement('div');
      h.className = 'hinw';
      h.textContent = e.hinweis;
      d.appendChild(h);
    }
    return d;
  }

  function protokollMalen() {
    const box = $('log');
    // Nur mitscrollen, wenn der Nutzer ohnehin unten steht.
    const amEnde = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
    box.textContent = '';
    if (!logListe.length) {
      const d = document.createElement('div');
      d.className = 'leermeldung';
      d.textContent = t('log.leer');
      box.appendChild(d);
      return;
    }
    const gruppen = logGruppen();
    if (!gruppen.length) {
      const d = document.createElement('div');
      d.className = 'leermeldung';
      d.textContent = t('log.keineTreffer');
      box.appendChild(d);
      return;
    }
    gruppen.forEach(g => {
      const grp = document.createElement('fig-group');
      grp.className = 'loggruppe';
      grp.setAttribute('collapsible', '');
      grp.setAttribute('open', logZu[g.name] ? 'false' : 'true');
      const kopf = document.createElement('fig-header');
      const h3 = document.createElement('h3');
      h3.className = 'lgname';
      h3.textContent = g.name;
      kopf.appendChild(h3);
      const zaehler = document.createElement('span');
      zaehler.className = 'lgzaehler';
      zaehler.title = t('log.gruppeTip', { err: g.err, warn: g.warn, info: g.info });
      [['err', '✕', g.err], ['warn', '△', g.warn], ['info', 'i', g.info]].forEach(x => {
        if (!x[2]) return;
        const c = document.createElement('span');
        c.className = 'lgchip ' + x[0];
        c.textContent = x[1] + ' ' + x[2];
        zaehler.appendChild(c);
      });
      kopf.appendChild(zaehler);
      grp.appendChild(kopf);
      grp.addEventListener('openchange', ev => {
        const auf = !!(ev && ev.detail && ev.detail.open);
        if (auf) delete logZu[g.name]; else logZu[g.name] = true;
      });
      g.eintraege.forEach(e => grp.appendChild(logEintragEl(e)));
      box.appendChild(grp);
    });
    if (amEnde) box.scrollTop = box.scrollHeight;
  }

  function logText() {
    return logGruppen().map(g => {
      const kopf = g.name + '  (✕ ' + g.err + ' · △ ' + g.warn + ' · i ' + g.info + ')';
      const zeilen = g.eintraege.map(e => {
        const z = ['  ', e.N != null && isFinite(e.N) ? '[' + e.N + ' px] ' : '',
          logArt(e) === 'err' ? '✕ ' : logArt(e) === 'warn' ? '△ ' : logArt(e) === 'ok' ? '✓ ' : '· ',
          e.text].join('');
        return e.hinweis ? z + '\n      ' + e.hinweis : z;
      });
      return [kopf].concat(zeilen).join('\n');
    }).join('\n\n');
  }
  function inZwischenablage(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => zwischenablageNotfall(text));
      return;
    }
    zwischenablageNotfall(text);
  }
  function zwischenablageNotfall(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }

  $('btnKopieren').addEventListener('click', () => {
    const text = logText();
    if (!text) { toast(t('toast.logNichts')); return; }
    inZwischenablage(text);
    toast(t('toast.logKopiert'));
  });
  $('segLog').addEventListener('change', e => {
    logFilter = String((e && e.detail) || $('segLog').value || 'alle');
    protokollZeichnen();
  });
  $('logSuche').addEventListener('input', e => {
    logSuche = String((e && e.detail != null) ? e.detail : ($('logSuche').value || '')).toLowerCase();
    protokollZeichnen();

  // ===== 70-vorschau.js =====
  // =========================================================================
  // Vorschau (§33, Runde 6 §39.1–39.7)
  // -------------------------------------------------------------------------
  // Die Bühne ist ein echter Viewport wie Figmas Canvas: EIN <canvas> in
  // Bühnengröße × devicePixelRatio, eigene Kamera {x, y, z}, alles wird je
  // Frame gezeichnet. Weltkoordinaten = Icon-Pixel; z = Gerätepixel je
  // Icon-Pixel.
  //
  // Zwei Modi: „Vorher/Nachher“ (Wischtrenner) und „Überlagern“. Die
  // Vergleichsbasis ist bei aktivem Snapping die ungesnappte Fassung
  // (`zellen[].ohne`), sonst der Library-Stand (`zellen[].alt`).
  //
  // Die Vektordarstellung rastert das SVG je Zoomstufe (2^k, bis 64) neu und
  // zeichnet 1:1 — so wird nichts unscharf. Verschobene Ankerpunkte kommen
  // aus einem eigenen SVG-Pfadparser (siehe „Punkte & Kanten“).
  // =========================================================================

  const ZOOM_STUFEN = [1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64];
  const Z_MIN = 1, Z_MAX = 64;
  const MODI = ['vn', 'ueberlagern'];
  const W_KARTE = 12;        // Weltabstand zwischen den Größenkarten

    for (let y = 0; y < a.h; y++) for (let x = 0; x < a.w; x++) {

    const feVor = feVorN ? feVorS / feVorN : null;
    const feNeu = feNeuN ? feNeuS / feNeuN : null;
    const massAlle = massGes > 0 && massOk === massGes;

    // Ein Satz in Klartext; bei Gleichstand keine zwei gleichen Zahlen.
    let art = 'neutral';
    if (!mitVor) {
      txt.textContent = t('urt.neu');
    } else if (aaVor != null && aaNeu != null && aaNeu < aaVor - 0.5) {
      txt.textContent = t('urt.besser', { alt: fmt('prozent', aaVor), neu: fmt('prozent', aaNeu) });
      art = 'gut';
    } else if (aaVor != null && aaNeu != null && aaNeu > aaVor + 0.5) {
      txt.textContent = t('urt.schlechter', { alt: fmt('prozent', aaVor), neu: fmt('prozent', aaNeu) });
      art = 'warn';
    } else {
      txt.textContent = t('urt.gleich', { neu: aaNeu == null ? fmt('fehler', feNeu) : fmt('prozent', aaNeu) });
    }
    if (massGes && !massAlle) art = 'warn';
    zeile.className = 'vzeile urteilzeile ' + art;

    // Höchstens zwei kurze Pills, danach der Hinweis auf die Vergleichsbasis.
    const d = mitVor ? fmtDelta(aaVor, aaNeu) : null;
    const kandidaten = [];
    if (d) kandidaten.push([d, d.charAt(0) === '−' ? 'gut' : 'warn']);
    if (massGes) kandidaten.push([
      t('urt.mass', { n: massOk, m: massGes }) + (massAlle ? ' ✓' : ' △'), massAlle ? 'gut' : 'warn']);
    if (punkte) kandidaten.push([t('urt.punkte', { n: punkte }), '']);
    else if (gerastet) kandidaten.push([t('urt.gerastet', { n: gerastet }), '']);
    if (!kandidaten.length && feNeu != null) kandidaten.push([t('urt.fehler', { v: fmt('fehler', feNeu) }), '']);
    kandidaten.slice(0, 2).forEach(k => pillen.appendChild(pille(k[0], k[1])));
    // Ohne Snapping gibt es keine zweite Basis — dann sagt die Zeile das auch.
    if (mitVor && !diffHatOhne()) pillen.appendChild(pille(t('urt.basisLib'), ''));
    // Unbenutzt, aber erklärend: der gemittelte Rasterfehler steht im Fuß.
    void feVor;
  }

  // ---- Layout in Weltkoordinaten -----------------------------------------
  // Eine Kachel je Größe — beide Modi zeigen genau eine Fläche.
  function layoutRechnen(A) {
    LAYOUT = [];
    let x = 0, maxN = 1;
    A.forEach((e, i) => {
      const N = e.N || 1;
      if (N > maxN) maxN = N;
      LAYOUT.push({ e: e, i: i, N: N, x: x, y: -N / 2, breite: N });
      x += N + W_KARTE;
    });
    const rand = W_POLSTER + 1;
    WELT = { x0: -rand, y0: -maxN / 2 - rand, x1: Math.max(0, x - W_KARTE) + rand, y1: maxN / 2 + rand };
  }

  // ---- Kamera --------------------------------------------------------------
  function leinwand() { return $('vpCanvas'); }
  function vpBreite() { return leinwand().width || 1; }
  function vpHoehe() { return leinwand().height || 1; }
  function dx(wx) { return (wx - KAM.x) * KAM.z; }
  function dy(wy) { return (wy - KAM.y) * KAM.z; }
  function weltX(devX) { return KAM.x + devX / KAM.z; }
  function weltY(devY) { return KAM.y + devY / KAM.z; }

  function klemmen(k) {
    k.z = Math.max(Z_MIN, Math.min(Z_MAX, k.z));
    const bw = vpBreite(), bh = vpHoehe();
    const links = (WELT.x0 - k.x) * k.z, rechts = (WELT.x1 - k.x) * k.z;
    if (rechts < SICHT_MIN) k.x = WELT.x1 - SICHT_MIN / k.z;
    else if (links > bw - SICHT_MIN) k.x = WELT.x0 - (bw - SICHT_MIN) / k.z;
    const oben = (WELT.y0 - k.y) * k.z, unten = (WELT.y1 - k.y) * k.z;
    if (unten < SICHT_MIN) k.y = WELT.y1 - SICHT_MIN / k.z;
    else if (oben > bh - SICHT_MIN) k.y = WELT.y0 - (bh - SICHT_MIN) / k.z;
    return k;
  }
  function anstossen(mitLerp) {
    if (mitLerp) sanft = true;
    if (malGeplant) return;
    malGeplant = true;
    requestAnimationFrame(schleife);
  }
  function schleife() {
    malGeplant = false;
    let weiter = false;
    if (sanft) {
      const f = 0.25;
      KAM.x += (ZIEL.x - KAM.x) * f;
      KAM.y += (ZIEL.y - KAM.y) * f;
      KAM.z += (ZIEL.z - KAM.z) * f;
      if (Math.abs(ZIEL.x - KAM.x) > 0.01 || Math.abs(ZIEL.y - KAM.y) > 0.01
        || Math.abs(ZIEL.z - KAM.z) > 0.005) weiter = true;
      else { KAM.x = ZIEL.x; KAM.y = ZIEL.y; KAM.z = ZIEL.z; sanft = false; }
    } else { KAM.x = ZIEL.x; KAM.y = ZIEL.y; KAM.z = ZIEL.z; }
    zeichnen();
    if (weiter) { malGeplant = true; requestAnimationFrame(schleife); }
  }
  function kameraSetzen(x, y, z, mitLerp) {
    ZIEL.x = x; ZIEL.y = y; ZIEL.z = z;
    klemmen(ZIEL);
    if (!mitLerp) { KAM.x = ZIEL.x; KAM.y = ZIEL.y; KAM.z = ZIEL.z; sanft = false; }
    zoomPilleSetzen();
    anstossen(mitLerp);
  }
  // Zoom um einen Punkt im Viewport (Gerätepixel): der Punkt bleibt liegen.
  function zoomUm(devX, devY, neuZ, mitLerp) {
    const z = Math.max(Z_MIN, Math.min(Z_MAX, neuZ));
    const wx = weltX(devX), wy = weltY(devY);
    kameraSetzen(wx - devX / z, wy - devY / z, z, mitLerp);
  }
  function zoomMitte(neuZ, mitLerp) { zoomUm(vpBreite() / 2, vpHoehe() / 2, neuZ, mitLerp); }
  function stufeNehmen(richtung) {
    const z = ZIEL.z;
    if (richtung > 0) {
      for (let i = 0; i < ZOOM_STUFEN.length; i++) if (ZOOM_STUFEN[i] > z + 0.01) return ZOOM_STUFEN[i];
      return Z_MAX;
    }
    for (let i = ZOOM_STUFEN.length - 1; i >= 0; i--) if (ZOOM_STUFEN[i] < z - 0.01) return ZOOM_STUFEN[i];
    return Z_MIN;
  }
  function fitRechnen() {
    if (!LAYOUT.length) return;
    const rand = 14 * dpr(), obenRaum = 30 * dpr();
    const bw = Math.max(40, vpBreite() - 2 * rand);
    const bh = Math.max(40, vpHoehe() - 2 * rand - obenRaum);
    const ww = Math.max(1, WELT.x1 - WELT.x0), wh = Math.max(1, WELT.y1 - WELT.y0);
    const z = Math.max(Z_MIN, Math.min(Z_MAX, Math.min(bw / ww, bh / wh)));
    const mx = (WELT.x0 + WELT.x1) / 2, my = (WELT.y0 + WELT.y1) / 2;
    return { x: mx - vpBreite() / 2 / z, y: my - (vpHoehe() / 2 - obenRaum / 2) / z, z: z };
  }
  function zoomFit(mitLerp) {
    const f = fitRechnen();
    if (f) kameraSetzen(f.x, f.y, f.z, mitLerp !== false);
  }
  function karteMittig(i, mitLerp) {
    const k = LAYOUT[Math.max(0, Math.min(LAYOUT.length - 1, i))];
    if (!k) return;
    aktiveKarte = k.i;
    kameraSetzen(k.x + k.breite / 2 - vpBreite() / 2 / ZIEL.z,
      k.y + k.N / 2 - vpHoehe() / 2 / ZIEL.z, ZIEL.z, mitLerp !== false);
  }
  function aufKarteZoomen(i, mitLerp) {
    const k = LAYOUT[Math.max(0, Math.min(LAYOUT.length - 1, i))];
    if (!k) return;
    aktiveKarte = k.i;
    const rand = 16 * dpr(), obenRaum = 30 * dpr();
    const z = Math.max(Z_MIN, Math.min(Z_MAX, Math.min(
      (vpBreite() - 2 * rand) / (k.breite + 2 * W_POLSTER),
      (vpHoehe() - 2 * rand - obenRaum) / (k.N + 2 * W_POLSTER))));
    kameraSetzen(k.x + k.breite / 2 - vpBreite() / 2 / z,
      k.y + k.N / 2 - (vpHoehe() / 2 - obenRaum / 2) / z, z, mitLerp !== false);
  }

  // ---- Zeichnen ------------------------------------------------------------
  function leinwandMessen() {
    const cv = leinwand(), box = $('buehne');
    const p = dpr();
    const b = Math.max(1, Math.round(box.clientWidth * p));
    const h = Math.max(1, Math.round(box.clientHeight * p));
    if (cv.width !== b || cv.height !== h) { cv.width = b; cv.height = h; return true; }
    return false;
  }
  function rundRechteck(g, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }
  function pillZeichnen(g, text, x, y, p) {
    g.font = '700 ' + Math.round(9 * p) + 'px Inter, system-ui, sans-serif';
    const b = g.measureText(text).width + 8 * p;
    const h = 13 * p;
    g.fillStyle = dunkel ? 'rgba(30,30,34,.82)' : 'rgba(255,255,255,.86)';
    rundRechteck(g, x, y, b, h, 4 * p);
    g.fill();
    g.fillStyle = textFarbe2();
    g.textBaseline = 'middle';
    g.fillText(text, x + 4 * p, y + h / 2 + 0.5 * p);
    g.textBaseline = 'alphabetic';
    return b;
  }

  // ---- Überlagern: farbige Onionskin ---------------------------------------
  // Deckung neutral, Unterschiede farbig. Je Pixel aus den Alphawerten:
  // gemeinsam = min(vor, neu) → Grau, nur vor → Orange, nur neu → Akzentblau.
  // Der Regler gewichtet die beiden Differenzanteile.
  const MISCH_GRAU = { hell: [58, 58, 68], dunkel: [217, 217, 222] };
  const MISCH_WEG  = { hell: [245, 166, 35], dunkel: [255, 184, 77] };
  function wegRgb() { return dunkel ? MISCH_WEG.dunkel : MISCH_WEG.hell; }
  function rgbText(f, alpha) {
    return 'rgba(' + f[0] + ',' + f[1] + ',' + f[2] + ',' + (alpha == null ? 1 : alpha) + ')';
  }
  // Auflösung der Rechenbilder: Pixel = echte Rasterung, Vektor feiner.
  function bildAufl(N) { return darstellung === 'vektor' ? N * 8 : (retina ? N * 2 : N); }
  function alphaFeld(bild, R) {
    const c = document.createElement('canvas');
    c.width = R; c.height = R;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = R !== bild.width;
    g.clearRect(0, 0, R, R);
    g.drawImage(bild, 0, 0, R, R);
    const d = g.getImageData(0, 0, R, R).data;
    const a = new Uint8ClampedArray(R * R);
    for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3];
    return a;
  }
  // Rechenquelle: im Vektormodus die feinste fertige Bitmap, sonst das PNG.
  function rechenBild(e, welche) {
    if (darstellung === 'vektor') {
      const v = vekErsatz(e, welche) || vekBild(e, welche);
      if (v) return v;
    }
    return welche === 'vor' ? e.bildVor : e.bildNeu;
  }
  function mischCanvas(e) {
    const R = bildAufl(e.N);
    const stufe = Math.round(blend / 5) * 5;
    const qVor = rechenBild(e, 'vor'), qNeu = rechenBild(e, 'neu');
    const sig = darstellung + '|' + R + '|' + stufe + '|' + (dunkel ? 'd' : 'h')
      + '|' + (qVor ? qVor.width : 0) + '|' + (qNeu ? qNeu.width : 0);
    if (e.mischSig === sig && e.misch) return e.misch;
    if (!qNeu && !qVor) return null;
    const A = qVor ? alphaFeld(qVor, R) : null;
    const B = qNeu ? alphaFeld(qNeu, R) : null;
    const c = document.createElement('canvas');
    c.width = R; c.height = R;
    const g = c.getContext('2d');
    const bild = g.createImageData(R, R);
    const d = bild.data;
    const grau = dunkel ? MISCH_GRAU.dunkel : MISCH_GRAU.hell;
    const weg = dunkel ? MISCH_WEG.dunkel : MISCH_WEG.hell;
    const dazu = akzentRgb();
    const gNeu = stufe / 100, gVor = 1 - gNeu;
    const vergleich = !!(A && B);
    for (let i = 0; i < R * R; i++) {
      const a = A ? A[i] / 255 : 0, b = B ? B[i] / 255 : 0;
      if (!vergleich) {
        const v = Math.max(a, b);
        if (v <= 0.004) continue;
        const k0 = i * 4;
        d[k0] = grau[0]; d[k0 + 1] = grau[1]; d[k0 + 2] = grau[2];
        d[k0 + 3] = Math.round(v * 255);
        continue;
      }
      const gem = Math.min(a, b);
      const nurA = Math.max(0, a - b) * gVor;
      const nurB = Math.max(0, b - a) * gNeu;
      const summe = gem + nurA + nurB;
      if (summe <= 0.004) continue;
      const k = i * 4;
      d[k]     = (grau[0] * gem + weg[0] * nurA + dazu[0] * nurB) / summe;
      d[k + 1] = (grau[1] * gem + weg[1] * nurA + dazu[1] * nurB) / summe;
      d[k + 2] = (grau[2] * gem + weg[2] * nurA + dazu[2] * nurB) / summe;
      d[k + 3] = Math.round(Math.min(1, summe) * 255);
    }
    g.putImageData(bild, 0, 0);
    e.misch = c; e.mischSig = sig;
    return c;
  }

  // Nach dem Umschalten blendet die Nachher-Kachel in 120 ms ein.
  function nachAlpha() {
    if (!blendeStart) return 1;
    const f = (Date.now() - blendeStart) / 120;
    if (f >= 1) { blendeStart = 0; return 1; }
    return Math.max(0.05, f);
  }
  function bildZeichnen(g, bild, x, y, s, alpha) {
    if (!bild) return;
    g.save();
    g.globalAlpha = alpha == null ? 1 : alpha;
    // Vektor-Bitmaps sind in Zoomauflösung gerastert: 1:1, nur beim Nachziehen
    // einer gröberen Stufe wird geglättet. Pixelansicht bleibt hart.
    g.imageSmoothingEnabled = darstellung === 'vektor' && Math.abs(bild.width - s) > 0.5;
    g.drawImage(bild, x, y, s, s);
    g.restore();
  }

  // ---- Flächen-Differenz (Schalter „Flächen“) -----------------------------
  // Entfernte Bereiche orange, hinzugekommene blau, je 70 % Deckung.
  function diffLayer(e) {
    const R = bildAufl(e.N);
    const qVor = rechenBild(e, 'vor'), qNeu = rechenBild(e, 'neu');
    const sig = darstellung + '|' + R + '|' + (dunkel ? 'd' : 'h')
      + '|' + (qVor ? qVor.width : 0) + '|' + (qNeu ? qNeu.width : 0);
    if (e.dlaySig === sig && e.dlay !== undefined) return e.dlay;
    e.dlaySig = sig; e.dlay = null;
    if (!qVor || !qNeu) return null;
    const A = alphaFeld(qVor, R), B = alphaFeld(qNeu, R);
    const c = document.createElement('canvas');
    c.width = R; c.height = R;
    const g = c.getContext('2d');
    const bild = g.createImageData(R, R);
    const d = bild.data;
    const weg = wegRgb(), dazu = akzentRgb();
    const schwelle = DIFF_SCHWELLE / 255;
    for (let i = 0; i < R * R; i++) {
      const diff = (A[i] - B[i]) / 255;
      if (Math.abs(diff) <= schwelle) continue;
      const f = diff > 0 ? weg : dazu;
      const k = i * 4;
      d[k] = f[0]; d[k + 1] = f[1]; d[k + 2] = f[2];
      d[k + 3] = Math.round(Math.min(1, Math.abs(diff)) * 0.7 * 255);
    }
    g.putImageData(bild, 0, 0);
    e.dlay = c;
    return c;
  }
  function flaechenZeichnen(g, e, x, y, s) {
    if (!flaechenAn) return;
    const lay = diffLayer(e);
    if (!lay) return;
    g.save();
    g.imageSmoothingEnabled = true;
    g.drawImage(lay, x, y, s, s);
    g.restore();
  }

  // ---- Punkte & Kanten (§39.4) --------------------------------------------
  // Vorher-Kontur dünn gestrichelt orange, Nachher-Kontur 1 px dunkel/hell,
  // verschobene Punkte als hohler Ring (alt) → gefüllter Punkt (neu).
  function pfadeStreichen(g, geo, x, y, s, N, farbe, p, gestrichelt) {
    if (!geo || typeof Path2D !== 'function') return;
    const f = s / (geo.W || N);
    geo.pfade.forEach(pf => {
      let pd;
      try { pd = new Path2D(pf.d); } catch (e) { return; }
      g.save();
      g.translate(x, y);
      g.scale(f, f);
      g.translate(pf.tx, pf.ty);
      g.strokeStyle = farbe;
      g.lineWidth = p / f;
      if (gestrichelt) g.setLineDash([3 * p / f, 2.5 * p / f]);
      g.stroke(pd);
      g.restore();
    });
  }
  function punkteZeichnen(g, e, x, y, s, N, p) {
    if (!punkteAn) return;
    const skal = s / N;
    if (e.geoVor) pfadeStreichen(g, e.geoVor, x, y, s, N, rgbText(wegRgb(), 0.85), p, true);
    if (e.geoNeu) pfadeStreichen(g, e.geoNeu, x, y, s, N, umrissFarbe(), p, false);
    const paare = e.paare || [];
    if (!paare.length) return;
    const r = Math.max(2.5 * p, Math.min(4.5 * p, skal * 0.22));
    g.save();
    paare.forEach(pa => {
      const ax = x + pa.ax * skal, ay = y + pa.ay * skal;
      const bx = x + pa.bx * skal, by = y + pa.by * skal;
      const hov = HOVER && HOVER.paar === pa;
      g.strokeStyle = rgbText(wegRgb(), 0.8);
      g.lineWidth = p;
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
      g.beginPath(); g.arc(ax, ay, r, 0, Math.PI * 2); g.stroke();
      g.fillStyle = akzent();
      g.beginPath(); g.arc(bx, by, hov ? r * 1.25 : r * 0.9, 0, Math.PI * 2); g.fill();
      if (hov) {
        g.strokeStyle = umrissFarbe();
        g.lineWidth = p;
        g.beginPath(); g.arc(bx, by, r * 1.9, 0, Math.PI * 2); g.stroke();
      }
    });
    g.restore();
  }
  // Sagt an der Nachher-Kachel, welche Fassung gerade zu sehen ist.
  function snapPille(g, x, y, p, rechteKante) {
    const txt = t(nachQuelle() === 'ohne' ? 'pill.snapAus' : 'pill.snapAn');
    g.font = '700 ' + Math.round(9 * p) + 'px Inter, system-ui, sans-serif';
    const b = g.measureText(txt).width + 8 * p;
    pillZeichnen(g, txt, rechteKante == null ? x : rechteKante - b, y, p);
  }
  // Kleine Zahl-Pille oben rechts: wie viele Kanten gerastet wurden.
  function kantenPille(g, k, x, y, s, p) {
    const n = Number(k.e.zelle.gerastet) || 0;
    if (!punkteAn || !n) return;
    const txt = t('urt.gerastet', { n: n });
    g.font = '700 ' + Math.round(9 * p) + 'px Inter, system-ui, sans-serif';
    const b = g.measureText(txt).width + 8 * p;
    pillZeichnen(g, txt, x + s - b - 4 * p, y + 20 * p, p);
  }

  function kachelZeichnen(g, k, p) {
    const s = k.N * KAM.z;
    const x = dx(k.x), y = dy(k.y);
    if (x > vpBreite() || y > vpHoehe() || x + s < 0 || y + s < 0) return;
    const e = k.e;
    g.fillStyle = kachelGrund();
    g.fillRect(x, y, s, s);

    const na = nachAlpha();
    if (vglModus === 'ueberlagern') {
      const m = mischCanvas(e);
      if (m) {
        g.save();
        g.globalAlpha = na;
        g.imageSmoothingEnabled = true;
        g.drawImage(m, x, y, s, s);
        g.restore();
      }
      flaechenZeichnen(g, e, x, y, s);
      punkteZeichnen(g, e, x, y, s, k.N, p);
      const bb0 = pillZeichnen(g, t('pill.beide'), x + 4 * p, y + 4 * p, p);
      snapPille(g, x + 8 * p + bb0, y + 4 * p, p);
    } else {
      // Vorher/Nachher: links die Basis, rechts das Ergebnis, Griff dazwischen.
      const vor = bildVon(e, 'vor');
      bildZeichnen(g, vor, x, y, s);
      if (!vor) {
        g.fillStyle = textFarbe2();
        g.font = Math.round(9 * p) + 'px Inter, system-ui, sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(t('diff.nuralt'), x + s / 2, y + s / 2);
        g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      }
      const w = Math.max(0, Math.min(s, s * wischPos));
      g.save();
      g.beginPath(); g.rect(x + w, y, s - w, s); g.clip();
      g.fillStyle = kachelGrund();
      g.fillRect(x + w, y, s - w, s);
      bildZeichnen(g, bildVon(e, 'neu'), x, y, s, na);
      flaechenZeichnen(g, e, x, y, s);
      g.restore();
      punkteZeichnen(g, e, x, y, s, k.N, p);
      // Griff
      g.save();
      g.strokeStyle = dunkel ? 'rgba(255,255,255,.9)' : 'rgba(20,20,30,.8)';
      g.lineWidth = p;
      g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w, y + s); g.stroke();
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(x + w, y + s / 2, 6 * p, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(20,20,30,.35)'; g.stroke();
      g.restore();
      pillZeichnen(g, vorherPille(), x + 4 * p, y + 4 * p, p);
      g.font = '700 ' + Math.round(9 * p) + 'px Inter, system-ui, sans-serif';
      const bb = g.measureText(t('pill.nachher')).width + 8 * p;
      pillZeichnen(g, t('pill.nachher'), x + s - bb - 4 * p, y + 4 * p, p);
      snapPille(g, 0, y + 21 * p, p, x + s - 4 * p);
      kantenPille(g, k, x, y, s, p);
    }

    // Pixelraster ab 6 Gerätepixeln je Icon-Pixel, sehr dezent
    if (KAM.z >= 6) {
      g.save();
      g.strokeStyle = dunkel ? 'rgba(200,200,220,.08)' : 'rgba(40,40,60,.08)';
      g.lineWidth = 1;
      g.beginPath();
      for (let i = 1; i < k.N; i++) {
        const gx = Math.round(x + i * KAM.z) + 0.5;
        const gy = Math.round(y + i * KAM.z) + 0.5;
        g.moveTo(gx, y); g.lineTo(gx, y + s);
        g.moveTo(x, gy); g.lineTo(x + s, gy);
      }
      g.stroke();
      g.restore();
    }
    g.strokeStyle = rahmenFarbe();
    g.lineWidth = p;
    g.strokeRect(x + p / 2, y + p / 2, s - p, s - p);
  }

  function zeichnen() {
    const cv = leinwand();
    if (!cv || !cv.getContext) return;
    const g = cv.getContext('2d');
    const p = dpr();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = grundFarbe();
    g.fillRect(0, 0, cv.width, cv.height);
    g.textBaseline = 'alphabetic';
    LAYOUT.forEach(k => {
      const x = dx(k.x - W_POLSTER), y = dy(k.y - W_POLSTER);
      const w = (k.breite + 2 * W_POLSTER) * KAM.z, h = (k.N + 2 * W_POLSTER) * KAM.z;
      if (x > cv.width || x + w < 0) return;
      g.strokeStyle = k.i === aktiveKarte ? akzent() : rahmenFarbe();
      g.lineWidth = p;
      rundRechteck(g, x + p / 2, y + p / 2, w - p, h - p, 8 * p);
      g.stroke();
      // Titel über der Karte, feste Schriftgröße in Gerätepixeln
      const ty = y - 5 * p;
      g.font = '700 ' + Math.round(11 * p) + 'px Inter, system-ui, sans-serif';
      g.fillStyle = textFarbe();
      const titel = zahl(k.N) + ' px';
      g.fillText(titel, x, ty);
      const tb = g.measureText(titel).width;
      k.titelFeld = { x: x - 4 * p, y: ty - 13 * p, w: tb + 8 * p, h: 18 * p };
      let tx = x + tb + 6 * p;
      const ok = massStimmt(k.e.zelle);
      if (ok != null) {
        g.fillStyle = ok ? '#12a76a' : '#c98a12';
        g.beginPath(); g.arc(tx + 3 * p, ty - 3.5 * p, 3 * p, 0, Math.PI * 2); g.fill();
        tx += 10 * p;
      }
      const d = deltaText(k.e.aaVor, k.e.aaNeu);
      if (d) {
        g.font = '700 ' + Math.round(9.5 * p) + 'px Inter, system-ui, sans-serif';
        g.fillStyle = d.charAt(0) === '−' ? '#12a76a' : '#c98a12';
        g.fillText(d, tx, ty);
      }
      kachelZeichnen(g, k, p);
    });
    if (blendeStart) anstossen(false);
  }

  // ---- Hit-Test und Hover --------------------------------------------------
  function titelUnter(devX, devY) {
    for (const k of LAYOUT) {
      const f = k.titelFeld;
      if (f && devX >= f.x && devY >= f.y && devX < f.x + f.w && devY < f.y + f.h) return k;
    }
    return null;
  }
  function kachelUnter(devX, devY) {
    const wx = weltX(devX), wy = weltY(devY);
    for (const k of LAYOUT) {
      if (wx >= k.x && wy >= k.y && wx < k.x + k.N && wy < k.y + k.N) {
        return { k: k, lx: wx - k.x, ly: wy - k.y,
          px: Math.floor(wx - k.x), py: Math.floor(wy - k.y) };
      }
    }
    return null;
  }
  // Nächster verschobener Punkt unter dem Zeiger (in Icon-Pixeln gemessen).
  function paarUnter(tr) {
    if (!punkteAn || !tr) return null;
    const grenze = Math.max(0.35, 8 / Math.max(1, KAM.z));
    let best = null, bestD = grenze;
    (tr.k.e.paare || []).forEach(pa => {
      const d = Math.sqrt((tr.lx - pa.bx) * (tr.lx - pa.bx) + (tr.ly - pa.by) * (tr.ly - pa.by));
      if (d < bestD) { bestD = d; best = pa; }
    });
    return best;
  }
  function griffNah(devX, devY) {
    if (vglModus !== 'vn') return null;
    for (const k of LAYOUT) {
      const s = k.N * KAM.z;
      const x = dx(k.x), y = dy(k.y);
      if (devY < y || devY > y + s) continue;
      if (Math.abs(devX - (x + s * wischPos)) <= 12 * dpr()) return k;
    }
    return null;
  }
  function hoverSetzen(treffer) {
    const alt = HOVER && HOVER.paar;
    HOVER = treffer;
    if ((treffer && treffer.paar) !== alt) anstossen(false);

  }

  // ---- Werkzeuge und Zeilen ------------------------------------------------

  function snapUmschalten(an) {

  function darstellungSetzen(v, melden) {

  // Höhengriff: 200–600 px, Merker `buehneHoehe`.
  (() => {
    const griff = $('bhGriff');

    griff.addEventListener('pointerdown', e => {
